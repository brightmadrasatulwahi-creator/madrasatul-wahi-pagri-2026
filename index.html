<script>
const CHAPTERS=[{"id":"foreword","title":"বাণী ও শুভেচ্ছা","glyph":"✦","desc":"সম্পাদকীয়, প্রধান, পরিচালক ও প্রিন্সিপাল","kind":"prose","content":[{"head":"সম্পাদকীয়","body":["আলহামদুলিল্লাহ। মাদরাসাতুল ওহীর পাগড়ি অনুষ্ঠান উপলক্ষে এই স্মারক প্রকাশ করতে পেরে আমরা মহান আল্লাহ তাআলার শুকরিয়া আদায় করছি। কুরআন হিফযের এই অর্জনের সঙ্গে জড়িয়ে আছে শিক্ষার্থীদের অধ্যবসায়, উস্তাদদের নিরলস পরিচর্যা এবং অভিভাবকদের আন্তরিক সহযোগিতা।","পাগড়ি গ্রহণ শিক্ষার্থীর জীবনে একটি স্মরণীয় স্বীকৃতি। এর সঙ্গে যুক্ত হয় অর্জিত হিফজ মজবুতভাবে ইয়াদ রাখা, ধারাবাহিকভাবে তিলাওয়াতের চর্চা চালিয়ে যাওয়া এবং আচরণে কুরআনের শিক্ষা ধারণ করার দায়িত্ব। আমাদের প্রত্যাশা, এই আয়োজন শিক্ষার্থীদের সেই দায়িত্ব পালনে নতুন উৎসাহ দেবে।","এই স্মারকে পাগড়িপ্রাপ্ত শিক্ষার্থীদের পরিচিতি, তাঁদের হিফযের অভিজ্ঞতা, উস্তাদদের স্মৃতি ও নসিহত এবং প্রতিষ্ঠানের শিক্ষাজীবনের কিছু স্মৃতি একসঙ্গে স্থান পেয়েছে। প্রতিষ্ঠানের পরিচিতি ও শিক্ষাপদ্ধতির সংক্ষিপ্ত বিবরণও পাঠককে এই পথচলার পটভূমি জানতে সাহায্য করবে।","শিক্ষার্থী, শিক্ষক, অভিভাবক এবং প্রতিষ্ঠানের কল্যাণকামী সবার প্রতি আমাদের কৃতজ্ঞতা। মহান আল্লাহ তাআলা এই প্রচেষ্টা কবুল করুন এবং শিক্ষার্থীদের ইলম, আমল ও উত্তম চরিত্রে সমৃদ্ধ জীবন দান করুন। আমিন।","সম্পাদক","স্মারক প্রকাশনা পরিষদ"]},{"head":"প্রতিষ্ঠান প্রধানের বার্তা","body":["বিসমিল্লাহির রাহমানির রাহীম","সমস্ত প্রশংসা মহান আল্লাহ তাআলার, যিনি তাঁর পবিত্র কালামের খেদমতের জন্য আমাদের নির্বাচন করেছেন। দরূদ ও সালাম বর্ষিত হোক প্রিয় নবী মুহাম্মদ ﷺ-এর ওপর, যাঁর পবিত্র ওপর নাযিল হয়েছে সর্বশেষ ও সর্বশ্রেষ্ঠ আসমানি গ্রন্থ আল-কুরআন।","আলহামদুলিল্লাহ, মাদরাসাতুল ওহীর ১১ জন শিক্ষার্থী হিফজুল কুরআন সম্পন্ন করে আজ পাগড়ির সম্মানে ভূষিত হতে যাচ্ছে। আমাদের জন্য এটি কেবল একটি আনুষ্ঠানিক আয়োজন নয়; বরং আল্লাহ তাআলার অশেষ অনুগ্রহ, দীর্ঘ সাধনার এক আনন্দঘন স্বীকৃতি এবং নতুন দায়িত্বের সূচনার দিন।","২০২১ সালে আমরা একটি স্বপ্ন নিয়ে এই প্রতিষ্ঠানের যাত্রা শুরু করি। সেই স্বপ্ন ছিল এমন একটি ঠিকানা গড়ে তোলা, যেখানে কোমলমতি শিশুরা অন্তরে কুরআনের বীজ বপন করবে। যত্ন, মমতা ও সুশৃঙ্খল তালীম-তারবিয়াতের মাধ্যমে সেই বীজ হৃদয়ের গভীরে শিকড় গাড়বে, একদিন মহীরুহে পরিণত হবে এবং তার ফল হিসেবে ফুটে উঠবে ইলম, আমল, আখলাক ও কল্যাণের সমৃদ্ধ জীবন। আজকের এই আয়োজন সেই স্বপ্নের এক উল্লেখযোগ্য বাস্তবায়ন। এর জন্য আমরা মহান আল্লাহ তাআলার দরবারে আন্তরিক শুকরিয়া আদায় করছি।","আমাদের এই নবীন হাফেজদের পথচলা সহজ ছিল না। প্রতিদিন তাহাজ্জুদের সময় জেগে ওঠা, নতুন সবক, সাত-সবক, আমুখতা, তিলাওয়াত, সওয়াল-জবাবের অনুশীলন এবং প্রতি সপ্তাহের সবীনা—এভাবেই অসংখ্য দিনের নীরব পরিশ্রম জমা হয়ে আজকের এই অর্জনে রূপ নিয়েছে। পাগড়ি সেই পরিশ্রমের একটি বিনম্র স্বীকৃতি মাত্র; এটি হিফজের সমাপ্তি নয়, বরং কুরআনের আমানত রক্ষার নতুন দায়িত্বের সূচনা। আমাদের প্রত্যাশা, এই সন্তানেরা কুরআনের আলো নিজেদের চরিত্র, আচরণ ও কর্মের মাধ্যমে মানুষের কাছে পৌঁছে দেবে।","সম্মানিত অভিভাবকবৃন্দের প্রতি আমাদের কৃতজ্ঞতা অপরিসীম। আপনারা নিজেদের কলিজার টুকরাকে দীর্ঘ সময় আমাদের আমানত হিসেবে অর্পণ করেছেন, ধৈর্য ধারণ করেছেন, দোয়া করেছেন এবং আমাদের ওপর আস্থা রেখেছেন। আল্লাহ তাআলা আপনাদের এই ত্যাগ ও ভালোবাসাকে উত্তম প্রতিদানে কবুল করুন।","শ্রদ্ধেয় উস্তাদগণও আমাদের গভীর কৃতজ্ঞতার দাবিদার। তাঁরা শুধু পাঠদানেই সীমাবদ্ধ থাকেননি; বরং প্রতিটি শিক্ষার্থীকে আপন সন্তানের মতো স্নেহ, ধৈর্য ও দায়িত্ববোধের সঙ্গে গড়ে তুলেছেন। তাঁদের এই নিরলস মেহনতের প্রকৃত প্রতিদান একমাত্র আল্লাহ তাআলাই দান করতে পারেন। প্রতিষ্ঠানের এই পথচলায় যাঁরা পরামর্শ, সহযোগিতা ও দোয়ার মাধ্যমে পাশে থেকেছেন, তাঁদের প্রতিও আন্তরিক কৃতজ্ঞতা জানাই।","আমরা জানি, আমাদের পথচলা এখনো অনেক বাকি। আত্মমূল্যায়ন, ধারাবাহিক উন্নয়ন এবং আল্লাহ তাআলার তাওফিকের ওপর ভরসা রেখে আমরা সামনে এগিয়ে যেতে দৃঢ়প্রতিজ্ঞ, ইনশাআল্লাহ।","মহান আল্লাহর কাছে আমাদের আন্তরিক প্রার্থনা—তিনি যেন এই সন্তানদের কুরআনের সত্যিকারের ধারক ও বাহক হিসেবে কবুল করেন, তাঁদের ইলম, আমল ও চরিত্রে বরকত দান করেন এবং তাঁদের মাধ্যমে দ্বীন, দেশ ও মানবতার কল্যাণ সাধন করেন। আমিন।","—বিভাগীয় প্রধান ও পরিচালক","মাদরাসাতুল ওহী","১০ ডিসেম্বর ২০২৬"]},{"head":"ডিরেক্টরের বাণী","body":["মাদরাসাতুল ওহী: কুরআনের খেদমতে এক স্বপ্নের পথচলা","একটি প্রয়াস, সদকায়ে জারিয়ার এক আকাঙ্ক্ষা","بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","মহান আল্লাহর সন্তুষ্টির আশায় পবিত্র কুরআনের খেদমত করাই মাদরাসাতুল ওহী (ব্রাইট স্কলার) প্রতিষ্ঠার মূল উদ্দেশ্য। আমি চেয়েছি, এখানে শিক্ষার্থীরা বিশুদ্ধভাবে কুরআন তিলাওয়াত শিখুক ও হিফজ করুক। এ উদ্যোগের মাধ্যমে একজন মানুষও বিশুদ্ধভাবে কুরআন পড়তে শিখলে, তা আমার জন্য বড় প্রাপ্তি।","আমার স্বপ্ন এমন একটি প্রজন্ম গড়ে তোলা, যাদের হৃদয়ে থাকবে কুরআন, জীবনে থাকবে সুন্নাহ। তারা সত্যবাদী ও আমানতদার হবে এবং পরিবার ও সমাজের কল্যাণে কাজ করবে। শিক্ষার্থীরা যখন কুরআনের শিক্ষা নিজেদের জীবনে ধারণ করবে ও পরবর্তী প্রজন্মের কাছে পৌঁছে দেবে, তখনই এ প্রতিষ্ঠান সার্থক হবে।","আমি চাই, আমার মৃত্যুর পরও এ প্রতিষ্ঠানে কুরআনের শিক্ষা চলতে থাকুক। আল্লাহ তাআলা এ প্রয়াসকে আমার জন্য সদকায়ে জারিয়া হিসেবে কবুল করুন। এ স্বপ্ন পূরণে শিক্ষক, অভিভাবক ও শুভাকাঙ্ক্ষীদের আন্তরিক সহযোগিতা ও দোয়া কামনা করি।","আল্লাহ তাআলা আমাদের নিয়ত বিশুদ্ধ করুন, এখান থেকে কুরআনের খাদেম গড়ে তুলুন এবং কিয়ামত পর্যন্ত এ প্রতিষ্ঠানকে কুরআন ও সুন্নাহর শিক্ষা ছড়িয়ে দেওয়ার বরকতময় মাধ্যম হিসেবে টিকিয়ে রাখুন। এর সঙ্গে সম্পৃক্ত সবাইকে উত্তম প্রতিদান দিন।","আমিন, ইয়া রব্বাল আলামিন।","মাওলানা জুনাইদ হোসেন, প্রতিষ্ঠাতা পরিচালক, ব্রাইট স্কলার"]},{"head":"প্রিন্সিপালের বাণী","body":["\"শিক্ষার আলোয় আলোকিত, সৃষ্টির সেরা মানব গড়ি\"","সমস্ত প্রশংসা আল্লাহ তাআলার যিনি একক ও অদ্বিতীয়। সালাত ও সালাম মানবতার মুক্তির দূত উম্মতের কান্ডারী নবী মুহাম্মাদুর রাসুলুল্লাহ (সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম) এর ওপর।","মহান আল্লাহ তাআলার প্রথম নির্দেশনা “পড়”। যে যত পড়ে সে তত জানে। সঠিক জ্ঞান অর্জন করা তথা উপকারী ইলম অর্জন করা অত্যন্ত গুরুত্বপূর্ণ বিষয়। আর সেই লক্ষ্যেই  ব্রাইট স্কলার ২০২১ সালে আত্মপ্রকাশ করেছে যখন অনেক প্রতিষ্ঠান বন্ধ হয়ে যাচ্ছিল করোনার ভয়াল থাবার কারণে। সেই কঠিন সময়ে এক ঝাঁক তরুণ আলেম বাংলাদেশ ও আমাদের প্রাণের ধর্ম ইসলামকে একযোগে বিশ্ব মঞ্চে তুলে ধরার স্বপ্ন বাস্তবায়নের লক্ষ্যে ব্রাইট স্কলার একটি সমন্বিত শিক্ষা প্রতিষ্ঠান প্রতিষ্ঠা করেছে। ব্রাইট স্কলার একটি ইসলামিক স্কুল ও বিশ্বমানের হিফযুল কুরআন শিক্ষা প্রতিষ্ঠান, যেখানে ইসলাম ও সাধারণ শিক্ষার সমন্বয়ে প্রতিটি শিশু পাবে যুগোপযোগী শিক্ষা। আমাদের প্রতিষ্ঠান প্রতিটি শিশুকে সঠিক জ্ঞান, ইসলামী নৈতিকতা এবং সৃজনশীলতার মাধ্যমে বিশ্বমঞ্চে তুলে ধরার লক্ষ্যে কাজ করছে। আমরা প্রতিটি শিক্ষার্থীর মধ্যে মানবিক গুণাবলী ও নেতৃত্বের ক্ষমতা গড়ে তুলতে প্রতিশ্রুতিবদ্ধ, যাতে তারা সমাজের উন্নয়ন ও শান্তির জন্য কাজ করতে পারে।","আমরা বাংলাদেশের সংস্কৃতি ও ইসলামী ঐতিহ্যকে গর্বের সাথে তুলে ধরতে প্রস্তুত। আমরা বিশ্বাস করি, সঠিক শিক্ষা ও ইসলামী মূল্যবোধের সমন্বয়ে আমাদের শিক্ষার্থীরা হতে পারে বিশ্বনাগরিক এবং সাফল্যের প্রতীক। আমরা বিশ্বাস করি, প্রতিটি শিক্ষার্থী হলো সম্ভাবনার এক অনন্য চিত্র, যারা নিজেদের দক্ষতা ও মূল্যবোধের ভিত্তিতে বিশ্ব মঞ্চে মাথা উঁচু করে দাঁড়াবে।","চলুন, আমরা একসাথে একটি নতুন প্রজন্মের নেতৃত্ব গড়ে তুলি, যারা হবে বিশ্বের জন্য অনুপ্রেরণা। অভিভাবক মণ্ডলীর দোয়া ও সার্বিক সহযোগিতা আমাদের পথ চলার পাথেয় হবে। শিক্ষার বৈপ্লবিক এ ধারাকে অগ্রগামী করার জন্য সকলের নিকট দোয়া কামনা করছি এবং মহান রাব্বুল আলামীনের নিকট তা বাস্তবায়ন করার ক্ষেত্রে সাহায্য চাই। আল্লাহ আমাদের এ প্রয়াস কবুল করুন, আমিন।","মুফতী সাইফুল ইসলাম, প্রিন্সিপ্যাল, ব্রাইট স্কলার"]},{"head":"চেয়ারম্যান ও অতিথিদের বাণী","body":["মূল স্মারকে কিছু বাণীর জন্য অনুমোদিত লেখা ও পরিচয় সংযোজনের স্থান সংরক্ষিত রয়েছে। তাই অসম্পূর্ণ বক্তব্য তৈরি করে প্রকাশ করা হয়নি।"]}]},{"id":"students","title":"আমাদের ১৪ হাফেজ","glyph":"♛","desc":"ছবি ও পরিচয়","kind":"students"},{"id":"reflections","title":"শিক্ষার্থীদের অনুভূতি","glyph":"❁","desc":"৯ জনের মূল লেখা","kind":"prose","content":[{"head":"রায়ান কবির রাখশান","body":["সমস্ত প্রশংসা সেই মহান রবের জন্য, যিনি তালিবে ইলম বানিয়ে আমায় ধন্য করেছেন। জীবনে বন্ধু হিসেবে অনেককেই পেয়েছি, পেয়েছি বড় ভাই হিসেবেও। মমতাময়ী মা-বাবা, ভাই, আত্মীয়-স্বজন ও সকল শুভাকাঙ্ক্ষীর প্রতি চিরকৃতজ্ঞতা জানাই। তাঁদের সহযোগিতা ও অনুপ্রেরণায় আজ এত কিছু অর্জন করতে পেরেছি।","শোধ করার মতো নয় উস্তাদদের ঋণ, যাঁদের পরশে পেয়েছি ঐশী আলোকবর্তিকা। আমার শেষ নিবেদন, আমার অযাচিত কথা ও কাজে কষ্ট পেয়ে থাকলে ক্ষমা করে দেবেন। দোয়া করি, জান্নাতে যেন আমাদের মিলনমেলা হয়। পরস্পরের মধ্যে সুসম্পর্ক, সৌহার্দ্য ও ভ্রাতৃত্বের বন্ধন অটুট রাখার তাওফিক রবের কাছে কামনা করি।"]},{"head":"মোঃ জুনায়েদ সিদ্দিক ঢালী","body":["বন্ধু, বছরখানেক আগে এক স্বপ্ন নিয়ে মাদরাসায় এসেছিলাম। মানুষ হওয়ার স্বপ্ন, সাহাবাদের মতো মানুষ। বলতে দ্বিধা নেই, আমার এ স্বপ্ন পূরণে শ্রদ্ধেয় উস্তাদগণ, সম্মানিত পিতা-মাতা ও দূর-কাছের প্রিয়জনরা চেষ্টার কোনো ত্রুটি রাখেননি। আমি তাঁদের প্রতি চিরকৃতজ্ঞ, চিরঋণী। আজও সেই স্বপ্ন লালন করি, বুকের মধ্যে ধারণ করি। আল্লাহ আমার স্বপ্নকে কবুল করুন। তাঁদের ওপর রহম করুন। দুনিয়া ও আখিরাতের পথ আমাদের জন্য সহজ ও নিরাপদ করুন। আমিন।"]},{"head":"মোঃ আয়াত বিন বাশার","body":["সবার আগে শুকরিয়া আদায় করছি মহান আল্লাহর, যিনি আমাকে আজ এই পর্যন্ত আসার তাওফিক দিয়েছেন। আলহামদুলিল্লাহ। কৃতজ্ঞতা জানাই শ্রদ্ধেয় উস্তাদ, মুরব্বি ও মা-বাবার প্রতি, যাঁদের দোয়া ও মেহনতে আজ আল্লাহর এত বড় নিয়ামত অর্জন করতে পেরেছি। ধন্যবাদ জানাই সাথি-সঙ্গীদের, যাঁদের সঙ্গে জীবনের অনেকটা পথ চলেছি। আল্লাহ সবাইকে কবুল করুন। আমিন। আসসালামু আলাইকুম।"]},{"head":"মোঃ আব্দুল্লাহ জাকওয়ান","body":["মহান মালিকের শুকরিয়া আদায় করছি। পড়ন্ত বেলায় খুব মনে পড়ছে প্রিয় বাবা-মা, আত্মীয়-স্বজন, আসাতিযায়ে কেরাম ও শুভাকাঙ্ক্ষীদের। তাঁদের অকৃত্রিম ভালোবাসা, দোয়া ও সুমধুর শাসনেই আমার বেড়ে ওঠা। পরিশেষে প্রভুর দরবারে প্রিয়জনদের কল্যাণ কামনা করছি।"]},{"head":"মূসা আবরার","body":["সমস্ত প্রশংসা মহান আল্লাহ তাআলার জন্য। কৃতজ্ঞতা জানাই পরম প্রিয় পিতা-মাতা, ভাই-বোন, আত্মীয়-স্বজন ও উস্তাদগণের প্রতি। তাঁদের দোয়া, ভালোবাসা, অক্লান্ত পরিশ্রম ও উত্তম রাহনুমায়ীর মাধ্যমে আমি কুরআন মাজিদ হিফজ সম্পন্ন করতে পেরেছি। আলহামদুলিল্লাহ। আল্লাহ তাঁদের জাযায়ে খায়ের দান করুন।"]},{"head":"সাইফুল্লাহ সাফওয়ান","body":["সমস্ত প্রশংসা আল্লাহ তাআলার, যিনি আমাকে ইলমে ওহীর বাহক হিসেবে কবুল করেছেন। কৃতজ্ঞতা জানাই আমার পিতা-মাতা ও বড় ভাইদের প্রতি, যাঁদের নিরলস পরিশ্রম ও সহযোগিতায় আমার এ পথে চলা সুগম হয়েছে। ধন্যবাদ জানাই মাদরাসাতুল ওহীর আসাতিযায়ে কেরাম ও সহপাঠীদের, যাঁদের সাহচর্য আমাকে অনুপ্রাণিত করেছে। আল্লাহ সবাইকে উত্তম বদলা দান করুন। আমিন।"]},{"head":"মোঃ আনাস আব্দুল্লাহ","body":["বেলা শেষে এসে অনুভূতির তালিকা সাজাতে বসলে তা অল্প কথায় শেষ হওয়ার নয়। সংক্ষেপে বলতে গেলে, আল্লাহ ও তাঁর রাসুলের পরে চিরকৃতজ্ঞতা জানাই পিতা-মাতা ও ভাই-বোনদের প্রতি। তাঁদের উৎসাহ ও শুভকামনায় আজকের এই আলোকময় পথের পথিক আমি।","অফুরন্ত ভালোবাসা শিক্ষকবৃন্দ ও সহপাঠীদের জন্য, যাঁদের সান্নিধ্যে দীর্ঘ সময় আনন্দে পার করেছি। প্রিয় মাদরাসাতুল ওহীর প্রতি ভালোবাসার ছবিও হৃদয়ে আঁকা। অশ্রুসিক্ত প্রতিটি প্রার্থনায় কামনা করি, তোমরা বেঁচে থাকো হাজার বছর।"]},{"head":"মোঃ মাহির আহমাদ নূর","body":["শুকরিয়া জানাই রব্বে কাবার। কৃতজ্ঞচিত্তে স্মরণ করি শ্রদ্ধেয় পিতা-মাতা ও পিতৃতুল্য উস্তাদগণকে। তাঁদের রাহনুমায়ি, নেক দোয়া ও প্রচেষ্টায় আমার এ পর্যন্ত বেড়ে ওঠা। আল্লাহ তাঁদের জাযায়ে খায়ের দান করুন।","কৃতজ্ঞতা জানাই প্রিয় সহপাঠীদের, যাঁদের সঙ্গে দীর্ঘ সময় পার করেছি। সর্বোপরি সবার জন্য কামনা করি প্রভুর করুণা। সবার কাছে দোয়াই আমার একান্ত কাম্য।"]},{"head":"মোহাম্মদ আরিয়ান ইসলাম","body":["সমস্ত প্রশংসা মহান রব্বুল আলামিনের জন্য, যিনি আমাকে ইলমে ওহীর বাহক হিসেবে কবুল করেছেন। আলহামদুলিল্লাহ। শিক্ষাজীবনের একটি গুরুত্বপূর্ণ অধ্যায়ের সমাপনীতে বিদায়ের বেদনায় মন ভারাক্রান্ত। হৃদয় থেকে শ্রদ্ধা ও কৃতজ্ঞতা জানাই আমার প্রাণপ্রিয় উস্তাদগণ, বাবা-মা ও প্রিয় সহপাঠীদের প্রতি।","বিশেষ করে উস্তাদগণ ও বাবা-মায়ের স্নেহ, শাসন ও নেক দোয়ার উসিলায় আজ এ পর্যন্ত আসতে পেরেছি। মাদরাসার সংশ্লিষ্ট সবার সহযোগিতা ও অক্লান্ত পরিশ্রম আমার ইলম অর্জনের পথ সহজ করেছে। মহান রব্বুল আলামিনের কাছে দোয়া করি, তিনি যেন তাঁদের সবাইকে জান্নাতুল ফেরদাউসের উচ্চ মাকাম নসিব করেন। তাঁদের এই পরিশ্রমের ঋণ শোধ করা সম্ভব নয়। ভারাক্রান্ত হৃদয়ে বলছি, বিদায় হে মাদরাসাতুল ওহী।"]}]},{"id":"parents","title":"অভিভাবকের অনুভূতি","glyph":"♡","desc":"৪ জনের মূল লেখা","kind":"prose","content":[{"head":"মোহাম্মদ কবির আহমেদ","body":["শিক্ষার্থী: রায়ান কবির রাখশান  |  সম্পর্ক: পিতা","পরম করুনাময় অসীম দয়ালু আল্লাহর নামে শুরু করছি।","আজকের এই পবিত্র ও বরকতময় ক্ষণে  আমাদের মনের ভিতরের আনন্দ, উচ্ছ্বাস আর কৃতজ্ঞতা প্রকাশ করার মত ভাষা আমাদের  জানা নেই। মহান আল্লাহ সুবহানাহু তাআলার দরবারে লাখো-কোটি শুকরিয়া, যিনি আমাদের মতো গুনাহগার বান্দাদের তার পবিত্র কালামের একজন হাফেজের পিতা-মাতা হওয়ার মহান গৌরব দান করেছেন। একই সাথে সালাত ও সালাম প্রিয় নবী হযরত মোহাম্মদ সাল্লাল্লাহু আলাইহি ওয়াসাল্লামের প্রতি। যার মাধ্যমে আমরা  পবিত্র গ্রন্থ  আল কোরআন পেয়েছি।","রায়ান কবির রাখশানের মাথায়  হাফেজী পাগড়ী পড়িয়ে দেওয়ার  দৃশ্যটি আমাদের জীবনের শ্রেষ্ঠ প্রাপ্তি ও  পরম আনন্দের। সন্তানদের কোরআনের হাফেজ/আলেম হিসেবে গড়ে তোলার স্বপ্নটি যেদিন বুকে ধারন করেছিলাম, সেদিন থেকেই এক ধরনের ব্যাকুলতা কাজ করতো। আজ সেই স্বপ্নের বাস্তব রূপ দেখে আমাদের চোখ দুটো আনন্দের অশ্রুতে ভিজে উঠছে।","এই মহান অর্জনের পিছনে যাদের অক্লান্ত পরিশ্রম, ধৈর্য আর ভালোবাসা জড়িয়ে আছে তারা হলেন মাদরাসাতুল ওহীর সম্মানিত উস্তাদজীগণ । অত্র  প্রতিষ্ঠানের সকল শিক্ষক ও সংশ্লিষ্ট কর্তৃপক্ষকে আমাদের অন্তরের অন্তস্থল থেকে মোবারকবাদ ও কৃতজ্ঞতা জানাই। আপনাদের দিন-রাত মেহনত আর সঠিক দিক নির্দেশনা ছাড়া আমাদের সন্তানের পক্ষে আল্লাহর এই পবিত্র আমানত সিনায় ধারন করা সম্ভব হতোনা। আল্লাহ আপনাদের এই দ্বীনি খেদমতকে 'কবুল করুন এবং উত্তম জাযা দান করুন।","আমরা আমাদের স্নেহের সন্তান হাফেজ রায়ান কবির রাখশানের জন্য দোয়া করি, আল্লাহ যেন তাকে কোরআনের আলোয় নিজের জীবনকে আলোকিত করার তাউফিক দান করেন। সে যেন শুধু মুখস্থকারী না হয়ে কোরআনের আদেশ-নিষেধ মেনে একজন সত্যিকারের আদর্শ মানুষ ও মুখলিস আলেম হতে পারে।","সবশেষে, এই স্মারক গ্রন্থের  মাধ্যমে আমরা সকলের কাছে আমাদের সন্তানের জন্য দোয়া প্রার্থী। আল্লাহ যেন মাদরাসাতুল ওহীকে দ্বীনের এক মজবুত কেল্লা হিসেবে কিয়ামত পর্যন্ত  কবুল ও মঞ্জুর করেন, আমীন।"]},{"head":"মাহমুদা নাসরীন","body":["শিক্ষার্থী: হাফেজ জুনায়েদ সিদ্দিক ঢালী   সম্পর্ক: মা","যাবতীয় প্রশংসা একমাত্র মহান আল্লাহ তাআলার, যিনি আমার সন্তানকে পবিত্র কুরআনের মহান আমানত বুকে ধারন করার তৌফিক দান করেছেন। দুরুদ ও সালাম বর্ষিত হোক মানবতার মুক্তিদূত বিশ্বনবী হযরত মুহাম্মদ (সাঃ)-এর প্রতি।","ব্রাইট স্কলার মাদরাসাতুল ওহী মাদ্রাসার পাগড়ি প্রদান স্মারকে কিছু লেখার সুযোগ পেয়ে আমি অত্যন্ত আনন্দিত। একজন মুসলিম মাতা হিসাবে সন্তানকে হাফেজে কুরআন হিসেবে দেখা আমার জীবনের সবচেয়ে বড় স্বপ্নছিল। আজ আমার সন্তান জুনায়েদ সিদ্দিক ঢালী যখন পবিত্র কুরআন হিফজ সম্পন্ন করেছে, তখন \"মা\" হিসেবে আমার বুক এক অনাবিল শান্তিতে ভরে উঠেছে।","এই অর্জনের পেছনে সবচেয়ে বড় অবদান এই মাদরাসার সম্মানিত উস্তাদজণের। বিশেষ করে মাদ্রাসার সম্মানিত মুহতামিম সাহেব এর কথা না বললেই নয়। মাদ্রসার সকল উস্তাজগণের অক্লান্ত পরিশ্রম, স্নেহ এবং সুশৃঙ্খল গাইড লাইন সত্যিই প্রশংসার দাবিদার। অন্য সকল দ্বীনি ভাই ও বোনদের প্রতি আমার অনুরোধ, আসুন আমরা আমাদের সন্তানকে দুনিয়াবি শিক্ষার পাশাপাশি  দ্বীনি শিক্ষায় শিক্ষিত করি।","পরিশেষে, আমি আমার হাফেজ সন্তানের জন্য সবার কাছে দোয়া চাই। আল্লাহ যেন তাকে কোরআনের আলো অনুযায়ী জীবন গড়ার তৌফিক-দান করেন এবং এই মাদ্রাসাকে দ্বীনের একটি বড় মারকাজ হিসেবে কবুল করেন। আমিন।"]},{"head":"জহিরুল ইসলাম","body":["শিক্ষার্থী: আব্দুল্লাহ জাকওয়ান  |  সম্পর্ক: বাবা","সমস্ত প্রশংসা মহান আল্লাহ তাআলার, যিনি আমার সন্তানকে পবিত্র কুরআন বুকে ধারণ করার তাওফিক দিয়েছেন। একটি বর্ণনায় এসেছে, যে ব্যক্তি কুরআন পড়ে ও সে অনুযায়ী আমল করে, কিয়ামতের দিন তার পিতা-মাতাকে সূর্যের আলোর চেয়েও দীপ্তিময় এক মুকুট পরানো হবে (সুনানে আবু দাউদ, ১৪৫৩)।","মাদরাসাতুল ওহী এর সম্মানিত উস্তাজদের প্রতি আমি চিরকৃতজ্ঞ। হরফ চেনা থেকে পুরো কুরআন হিফজ করা পর্যন্ত তাঁরা আমার সন্তানকে পরম যত্ন, ধৈর্য ও স্নেহে পথ দেখিয়েছেন। মাদরাসার শান্ত দ্বীনি পরিবেশে সে উত্তম চরিত্র গড়ার শিক্ষা পেয়েছে। এই প্রতিষ্ঠান ও তার ছাত্রাবাসের প্রতি আমার হৃদয়ের টান আজীবন থাকবে।","আমার কাছে দুনিয়ার সব সম্পদের চেয়েও মূল্যবান আমার সন্তানের হাফেজ হওয়ার এই নিয়ামত। আল্লাহ যেন এই অর্জনকে তার ও আমাদের জন্য সদকায়ে জারিয়া এবং আখিরাতে নাজাতের উসিলা করেন। আমার সন্তান ও তার সহপাঠী, মাদরাসাতুল ওহী এবং এর সকল উস্তাদের কল্যাণ ও সফলতার জন্য দোয়া করি। আমিন।"]},{"head":"মোঃ রফিকুল ইসলাম","body":["শিক্ষার্থী: মাহির আহমাদ নূর  |  সম্পর্ক: বাবা","বিসমিল্লাহির রাহমানির রাহিম","প্রিয় পুত্র মাহির আহমাদ নূরের প্রতি","পিতার হৃদয়ের গভীর থেকে কিছু কথা","প্রিয় মাহির আহমাদ নূর","আলহামদুলিল্লাহ! আজ আমার জীবনের অন্যতম আনন্দের ও গর্বের দিন। তোমার মাথায় পাগড়ী উঠতে যাচ্ছে। পবিত্র কুরআনের ৩০ পারা বুকে ধারণ করে তুমি আজ জীবনের এক মহৎ অধ্যায় অতিক্রম করেছ। এই অর্জন শুধু তোমার একার নয়, এটি আমাদের পরিবারের জন্য মহান আল্লাহর এক অমূল্য নিয়ামত।","বাবা, মনে আছে তোমার শৈশবের সেই দিনগুলোর কথা? কত স্বপ্ন, কত আশা আর কত দোয়া নিয়ে তোমাকে দ্বীনি শিক্ষার পথে এগিয়ে দিয়েছিলাম। আজ সেই স্বপ্নের একটি সুন্দর বাস্তব রূপ দেখতে পাচ্ছি। তোমার এই সাফল্যে আমার হৃদয় আনন্দে আপ্লুত। মহান আল্লাহর দরবারে লাখো শুকরিয়া।","মনে রেখো, হাফেজ হওয়া শুধু একটি উপাধি নয়; এটি এক বিশাল আমানত ও আজীবনের দায়িত্ব। পবিত্র কুরআন শুধু মুখস্থ রাখার জন্য নয়, বরং নিজের জীবনে ধারণ করার জন্য। তোমার প্রতিটি কথা, কাজ, আচরণ ও চরিত্রে যেন কুরআনের শিক্ষা প্রতিফলিত হয়।","বাবা, তোমার মাথার এই পাগড়ী যেন কখনো অহংকারের কারণ না হয়; বরং বিনয়, তাকওয়া, আদব, আমানতদারি ও দ্বীনের প্রতি দায়িত্ববোধের প্রতীক হয়ে থাকে। তুমি কুরআনের আলোয় নিজের জীবন আলোকিত করবে এবং সেই আলো মানুষের মাঝে ছড়িয়ে দেবে—এটাই আমার প্রত্যাশা।","জীবনের পথে অনেক বাধা আসবে, অনেক কঠিন সময়ের মুখোমুখি হতে হবে। কখনো হতাশ হয়ো না। সর্বদা আল্লাহর ওপর ভরসা রেখো। কুরআনের সঙ্গে তোমার সম্পর্ক যেন কখনো বিচ্ছিন্ন না হয়। জীবনের শেষ নিঃশ্বাস পর্যন্ত কুরআনের খাদেম হয়ে থেকো।","একজন বাবা হিসেবে তোমার কাছে আমার সবচেয়ে বড় চাওয়া—তুমি শুধু একজন হাফেজে কুরআন হয়েই থেমে থেকো না; বরং কুরআনের প্রকৃত অনুসারী, উত্তম চরিত্রের অধিকারী, নেককার মানুষ এবং দ্বীনের একনিষ্ঠ খাদেম হয়ে ওঠো।","হে আমার রব! আমার সন্তান মাহির আহমাদ নূরকে কুরআনের আলোয় আলোকিত রাখুন। তার মুখস্থ করা প্রতিটি আয়াতকে তার জীবনের পাথেয় বানিয়ে দিন। তাকে ইলমে নাফে, আমলে সালেহ, উত্তম আখলাক ও তাকওয়া দান করুন। কুরআনকে তার হৃদয়ের প্রশান্তি, জীবনের পথপ্রদর্শক এবং আখিরাতের নাজাতের উসিলা বানিয়ে দিন। তাকে দুনিয়া ও আখিরাতে সম্মানিত করুন এবং আমাদের জন্য সদকায়ে জারিয়া হিসেবে কবুল করুন। আমিন।","শেষ কথা","নূর, তোমার মাথায় আজ যে পাগড়ী উঠবে, সেটি আমার কাছে শুধু একটি সম্মানের স্মারক নয়; এটি আমার বহু বছরের স্বপ্ন, দোয়া ও ভালোবাসার প্রতিচ্ছবি।","তোমার জন্য আমার দোয়া কখনো শেষ হবে না। তুমি যেখানেই থাকো, যে অবস্থাতেই থাকো, কুরআনকে আঁকড়ে ধরে থেকো।","তোমাকে নিয়ে আজ আমি গর্বিত, আল্লাহর কাছে কৃতজ্ঞ এবং তোমার উজ্জ্বল আখিরাতের প্রত্যাশায় আশাবাদী।","অনেক অনেক দোয়া, স্নেহ ও অফুরন্ত ভালোবাসা রইল।","ইতি,","তোমার গর্বিত বাবা।"]}]},{"id":"institution","title":"প্রতিষ্ঠান ও শিক্ষাদর্শ","glyph":"⌂","desc":"পরিচিতি, শিক্ষা কার্যক্রম ও পথচলা","kind":"prose","content":[{"head":"আমাদের পরিচিতি","body":["মাদরাসাতুল ওহী ব্রাইট স্কলারের তত্ত্বাবধানে পরিচালিত একটি দ্বীনি শিক্ষাপ্রতিষ্ঠান। ব্রাইট স্কলারের যাত্রা শুরু হয় ২০২১ সালে। প্রাথমিক পর্যায়ে শিশু শ্রেণি থেকে পঞ্চম শ্রেণি পর্যন্ত NCTB নির্ধারিত শিক্ষাক্রমের পাশাপাশি নিজস্ব প্রণীত ইসলামি শিক্ষা সিলেবাসের সমন্বয়ে প্রতিষ্ঠানটির শিক্ষা কার্যক্রম শুরু হয়। ‘ধর্মীয় পরিবেশে আধুনিক শিক্ষা’—এই প্রত্যয়কে ধারণ করে শুরু থেকেই আমাদের লক্ষ্য ছিল সাধারণ ও ধর্মীয় শিক্ষার সমন্বয়ে একটি সুশিক্ষিত প্রজন্ম গড়ে তোলা।","এই ধারাবাহিকতায় ২০২২ সালের আগস্ট মাস থেকে হিফজুল কুরআনকেন্দ্রিক আনুষ্ঠানিক কার্যক্রম শুরু হয়। কুরআনের নূর, উত্তম চরিত্র ও প্রয়োজনীয় আধুনিক শিক্ষার সমন্বয়ে জ্ঞান, নৈতিকতা ও মননশীলতায় সমৃদ্ধ একটি আলোকিত প্রজন্ম গড়ে তোলার প্রত্যয় নিয়েই আমাদের পথচলা।","আমরা বিশ্বাস করি, কুরআন হিফজ করা নিঃসন্দেহে এক মহিমান্বিত অর্জন; তবে প্রকৃত সাফল্য কেবল কুরআন মুখস্থ করার মধ্যে সীমাবদ্ধ নয়। বরং সেই কুরআনের প্রতি গভীর ভালোবাসা হৃদয়ে ধারণ করা এবং জীবনের প্রতিটি ক্ষেত্রে নববী আদর্শের প্রতিফলন ঘটানোই একজন শিক্ষার্থীর প্রকৃত সার্থকতা।"]},{"head":"আমাদের শিক্ষাদর্শ","body":["মাদরাসাতুল ওহীর শিক্ষা কার্যক্রমে হিফজুল কুরআন সর্বোচ্চ অগ্রাধিকার পায়। এর পাশাপাশি শিক্ষার্থীদের প্রয়োজনীয় সাধারণ শিক্ষায় শিক্ষিত করে তুলতে নির্বাচিত বিষয়গুলো পাঠ্যক্রমে অন্তর্ভুক্ত করা হয়েছে। আমরা দুটি স্বতন্ত্র শিক্ষাধারাকে এমনভাবে সমন্বয় করি, যাতে সাধারণ শিক্ষার কার্যক্রম হিফজের অগ্রগতিকে ব্যাহত না করে; বরং শিক্ষার্থীর সামগ্রিক জ্ঞান ও মননের বিকাশে ভূমিকা রাখে।","আমাদের প্রত্যাশা, এ পরিকল্পিত শিক্ষাব্যবস্থার মাধ্যমে শিক্ষার্থীরা একদিকে যেমন দক্ষ ও যত্নশীল হাফেজ হিসেবে গড়ে উঠবে, অন্যদিকে প্রয়োজনীয় সাধারণ জ্ঞান ও জীবনদক্ষতায় সমৃদ্ধ সুশিক্ষিত মানুষ হিসেবেও নিজেদের গড়ে তুলবে।"]},{"head":"পাঠদান ও তদারকি","body":["আমাদের পাঠদান পরিচালিত হয় সুনির্দিষ্ট পদ্ধতি ও নিয়মিত মূল্যায়নের ভিত্তিতে। শিক্ষার্থীদের হিফজ কার্যক্রমকে সুসংহত ও মজবুত করার লক্ষ্যে প্রতিদিনের পাঠ চারটি ধাপে বিন্যস্ত: নতুন সবক, চলমান পারার সাত-সবক, পূর্বে মুখস্থ করা পারা থেকে আমুখতা এবং তিলাওয়াত।","হিফজের ধারাবাহিকতা ও মজবুত ইয়াদ নিশ্চিত করতে প্রতি সপ্তাহে সবীনা এবং সাপ্তাহিক, মাসিক ও সেমিস্টারভিত্তিক পরীক্ষার ব্যবস্থা রয়েছে। এসব মূল্যায়নের মাধ্যমে শিক্ষার্থীদের মুখস্থের মান, পাঠের অগ্রগতি ও শুদ্ধতা পর্যবেক্ষণ করা হয়।","প্রতিটি শিক্ষার্থীর দৈনিক পাঠ, উপস্থিতি ও আদব-আখলাকের তথ্য নিয়মিত রিপোর্ট বইয়ে লিপিবদ্ধ করা হয়। অভিভাবকগণ প্রতি মাসে এই রিপোর্ট পর্যবেক্ষণের মাধ্যমে সন্তানের শিক্ষাগত অগ্রগতি ও আচরণগত অবস্থার বিষয়ে অবগত হতে পারেন।","প্রতিটি শিশুর প্রতি যথাযথ ব্যক্তিগত মনোযোগ ও নিবিড় তদারকি নিশ্চিত করতে প্রতি গ্রুপে সর্বোচ্চ ১২ জন শিক্ষার্থী রাখা হয়।"]},{"head":"বিভাগ ও ব্যবস্থাপনা","body":["মাদরাসাতুল ওহীতে বালক শাখার পাশাপাশি রয়েছে সম্পূর্ণ পৃথক ব্যবস্থাপনায় পরিচালিত বালিকা শাখা, যেখানে পর্দার সুষ্ঠু ব্যবস্থা নিশ্চিত করে অভিজ্ঞ মহিলা শিক্ষিকাদের মাধ্যমে যাবতীয় শিক্ষা কার্যক্রম পরিচালিত হয়। আমাদের শিক্ষা কার্যক্রমে রয়েছে নূরানী ও প্রাক-প্রাথমিক বিভাগ, ইন্টারন্যাশনাল হিফজুল কুরআন বিভাগ, হিফজ শোনানো (রিভিশন) বিভাগ, এক বছর মেয়াদি খুসূসী বিভাগ এবং সাধারণ বিদ্যালয়ে অধ্যয়নরত শিক্ষার্থীদের জন্য আফটার স্কুল মক্তব।","শিক্ষার্থীদের প্রয়োজন বিবেচনায় আবাসিক ও অনাবাসিক—উভয় ব্যবস্থাই চালু রয়েছে। শিশুদের নিরাপত্তায় রয়েছে সার্বক্ষণিক সিসিটিভি পর্যবেক্ষণ। পাঠদান ও আবাসনের পরিবেশ আরামদায়ক রাখতে শ্রেণিকক্ষ ও আবাসন শীতাতপ নিয়ন্ত্রিত। পাশাপাশি শিক্ষার্থীদের সুস্বাস্থ্য ও পুষ্টির কথা বিবেচনা করে রয়েছে সুষম ও পুষ্টিকর খাবারের ব্যবস্থা।"]},{"head":"চরিত্র গঠন ও আত্মশুদ্ধি","body":["আমাদের লক্ষ্য শিক্ষার্থীদের শুধু মেধাবী করে গড়ে তোলা নয়; বরং জ্ঞান, নৈতিকতা, বিনয় ও আমানতদারিতায় সমৃদ্ধ আদর্শ মানুষ হিসেবে গড়ে তোলা। এ লক্ষ্যে তাহাজ্জুদে অভ্যস্ত করা, দৈনন্দিন সুন্নাহ ও প্রয়োজনীয় মাসআলা চর্চা এবং আলেমদের সান্নিধ্যে নিয়মিত তালীম-তারবিয়াতের ব্যবস্থা রয়েছে।","পাশাপাশি শিক্ষার্থীদের সৃজনশীলতা, আত্মবিশ্বাস ও আত্মপ্রকাশের দক্ষতা বিকাশে রয়েছে সুন্দর হাতের লেখার অনুশীলন, বাংলা ও ইংরেজিতে সাবলীলভাবে কথা বলা এবং জনসম্মুখে বক্তব্য প্রদানের চর্চা। শিক্ষাসফর ও খেলাধুলার মাধ্যমে তাদের শারীরিক ও মানসিক বিকাশে গুরুত্ব দেওয়া হয়। ফল উৎসব ও পিঠা উৎসবের মতো আনন্দঘন আয়োজন শিক্ষার্থীদের নিজস্ব সংস্কৃতি ও ঐতিহ্যের সঙ্গে পরিচিত হওয়ার সুযোগ করে দেয়।","এ ছাড়া প্রতিটি শিক্ষার্থীর হিফজ সম্পন্ন হওয়ার পর আয়োজন করা হয় পবিত্র কুরআনের খতম ও পাগড়ি অনুষ্ঠান। এটি শিক্ষার্থীর অর্জনের স্বীকৃতি, শিক্ষক-অভিভাবকদের আনন্দের উপলক্ষ এবং কুরআনের সঙ্গে আজীবন সম্পর্ক বজায় রাখার অনুপ্রেরণা হিসেবে স্মরণীয় হয়ে থাকে।"]},{"head":"আমাদের পথচলা","body":["মাদরাসাতুল ওহীকে আমরা একটি দীর্ঘমেয়াদি শিক্ষা-প্রকল্প হিসেবে বিবেচনা করি। শিক্ষার মানোন্নয়ন, শিক্ষক প্রশিক্ষণ, নিয়মিত মূল্যায়ন এবং অভিভাবকদের গঠনমূলক সম্পৃক্ততার মাধ্যমে ধাপে ধাপে এগিয়ে যাওয়াই আমাদের লক্ষ্য। আমরা বিশ্বাস করি, একটি সুশৃঙ্খল শিক্ষাব্যবস্থা, যোগ্য শিক্ষক এবং সহায়ক পরিবেশ শিক্ষার্থীদের বিকাশে গুরুত্বপূর্ণ ভূমিকা রাখে। তাই নির্দিষ্ট কোনো ফলাফলের নিশ্চয়তা দেওয়ার পরিবর্তে শিক্ষার্থীদের জন্য একটি উপযুক্ত শিক্ষার ভিত্তি ও পরিবেশ গড়ে তুলতে আমরা আন্তরিকভাবে কাজ করে যাচ্ছি।"]}]},{"id":"directors","title":"পরিচালনা পর্ষদ","glyph":"♧","desc":"৭ জনের ছবি, নাম ও পদবি","kind":"directors"},{"id":"significance","title":"পাগড়ি অনুষ্ঠানের তাৎপর্য","glyph":"❖","desc":"অর্জনের মর্যাদা ও দায়িত্ব","kind":"prose","content":[{"head":"পাগড়ি অনুষ্ঠানের তাৎপর্য","body":["পবিত্র কুরআনুল কারিমের হিফজ সম্পন্ন করা একজন শিক্ষার্থীর জীবনে এক অনন্য গৌরব ও মর্যাদার অর্জন। পাগড়ি অনুষ্ঠান সেই অর্জনের আনুষ্ঠানিক স্বীকৃতি, শিক্ষার্থীর প্রতি ভালোবাসা ও উৎসাহের প্রকাশ এবং তার ওপর অর্পিত কুরআনের হিফাজত ও চর্চার মহান দায়িত্বের স্মারক।","সম্মানিত অতিথি, অভিভাবক, শিক্ষক ও শুভানুধ্যায়ীদের উপস্থিতিতে আয়োজিত এ অনুষ্ঠান শিক্ষার্থীর ভবিষ্যৎ জীবনের জন্য দোয়া ও শুভকামনা জানানোর এক বিশেষ উপলক্ষ। একই সঙ্গে এটি কুরআনের সঙ্গে আজীবন সম্পর্ক অটুট রাখা, অর্জিত হিফজের সংরক্ষণ ও নিয়মিত চর্চা অব্যাহত রাখা এবং কুরআনের শিক্ষা ও আদর্শ জীবনে ধারণ করার অনুপ্রেরণা জোগায়।"]}]},{"id":"guidance","title":"দিকনির্দেশনা ও জীবন","glyph":"☼","desc":"অভিভাবক, শিক্ষা ও আবাসিক জীবন","kind":"prose","content":[{"head":"দ্বীনি শিক্ষায় পিতা-মাতার ভূমিকা","body":["সন্তান মহান আল্লাহ তাআলার পক্ষ থেকে পিতা-মাতার নিকট অর্পিত এক মহামূল্যবান আমানত। তার ঈমান, আমল, চরিত্র ও ভবিষ্যৎ গঠনের প্রথম এবং সর্বাধিক গুরুত্বপূর্ণ দায়িত্ব পিতা-মাতার। শিক্ষা প্রতিষ্ঠান কেবল এই মহান দায়িত্ব পালনে আপনাদের বিশ্বস্ত সহযোগী।","নিয়তকে আল্লাহর জন্য বিশুদ্ধ করুন — সন্তানকে দ্বীনি শিক্ষা দিন কেবল আল্লাহর সন্তুষ্টি, আখিরাতের সফলতা এবং দ্বীনের খেদমতের উদ্দেশ্যে।","বাসায় একটি দ্বীনি পরিবেশ গড়ে তুলুন — পাঁচ ওয়াক্ত সালাত, কুরআন তিলাওয়াত, সুন্নাহর অনুশীলন ও ইসলামী আদব-আখলাককে পারিবারিক সংস্কৃতিতে পরিণত করুন।","নিজেরা সন্তানের জন্য উত্তম আদর্শ হোন — পিতা-মাতার আমল, তাকওয়া, হালাল উপার্জন ও উত্তম চরিত্র সন্তানের ব্যক্তিত্ব গঠনে গভীর প্রভাব ফেলে।","সন্তানের পড়াশোনা, আমল ও আখলাকের নিয়মিত তদারকি করুন — প্রতিষ্ঠান কর্তৃপক্ষের সঙ্গে নিয়মিত যোগাযোগ বজায় রেখে সার্বিক উন্নয়নে সহযোগিতা করুন।","শিক্ষক, প্রতিষ্ঠান ও ইলমের প্রতি শ্রদ্ধাবোধ গড়ে তুলুন — ইলমের বরকত অর্জনের অন্যতম মাধ্যম হলো উস্তাদের সম্মান ও প্রতিষ্ঠানের নিয়ম-কানুনের প্রতি আনুগত্য।","সন্তানের জন্য নিয়মিত দোয়া করুন — হিদায়াত, ইলমের বরকত ও সফলতা একমাত্র আল্লাহ তাআলার পক্ষ থেকেই আসে।"]},{"head":"হিফযের পরবর্তী শিক্ষাপথ","body":["হিফজ সমাপনের পর শিক্ষার্থীদের আগ্রহ, যোগ্যতা ও প্রস্তুতি অনুযায়ী পরবর্তী শিক্ষার পথ বেছে নিতে সহায়তা করা প্রতিষ্ঠানের পরিকল্পনার অংশ।","খুসূসী বিভাগ ও কওমী শিক্ষা","এক বছর মেয়াদি ব্রিজ কোর্সের মাধ্যমে দ্বীনি ও সাধারণ শিক্ষার ভিত্তি সুদৃঢ় করে কওমী নেসাবের মুতাওয়াসসেতা পরবর্তী জামাতে অধ্যয়নের উপযোগী করে তোলার প্রস্তুতি দেওয়া হয়।","আলিয়া ও সাধারণ শিক্ষাধারা","জাতীয় শিক্ষাক্রম অনুসরণে প্রস্তুতির লক্ষ্য হলো শিক্ষার্থীকে আলিয়া মাদরাসা বা সাধারণ বিদ্যালয়ের অষ্টম শ্রেণিতে অগ্রসর হওয়ার উপযোগী করে তোলা।","আরবি ও উচ্চশিক্ষা","দ্বীনি শিক্ষার উচ্চতর ধাপ সম্পন্ন করে আরবি ও অন্যান্য বিষয়ে উচ্চশিক্ষা এবং গবেষণার পথেও শিক্ষার্থীরা অগ্রসর হতে পারে। এসব সম্ভাবনা বাস্তবায়নে নিজস্ব আগ্রহ, যোগ্যতা ও পরিশ্রম গুরুত্বপূর্ণ।","এই প্রস্তুতি কোনো নিশ্চিত ফলাফলের প্রতিশ্রুতি নয়; শিক্ষার্থীর জন্য উপযুক্ত ভিত্তি ও সহায়ক পরিবেশ গড়ে তোলাই এর উদ্দেশ্য।"]},{"head":"আদব আখলাক ও জীবনদক্ষতা","body":["পাঠের পাশাপাশি দৈনন্দিন আচরণ, দায়িত্ববোধ ও পারস্পরিক সহযোগিতার চর্চা শিক্ষার্থীদের ব্যক্তিত্ব গঠনের অংশ।","আমল ও চরিত্র","নিয়মিত তালিম ও নাসিহতের মাধ্যমে আত্মশুদ্ধি এবং ব্যবহারিক আদব আখলাকের চর্চা করা হয়। প্রয়োজনীয় দুআ, সুন্নাহ ও নিত্যদিনের মাসআলা অনুশীলনকে দৈনন্দিন জীবনের সঙ্গে যুক্ত করা হয়।","ভাষা ও প্রকাশের দক্ষতা","আরবি, বাংলা ও ইংরেজিতে উপস্থাপনা অনুশীলন এবং সুন্দর হাতের লেখায় যত্নের মাধ্যমে শিক্ষার্থীদের আত্মবিশ্বাস ও প্রকাশক্ষমতা বাড়াতে সহায়তা করা হয়।","দায়িত্ব ও সহযোগিতা","দলগত কাজ, সহমর্মিতা, সময়ের সঠিক ব্যবহার এবং ব্যক্তিগত দায়িত্ব পালনের চ
