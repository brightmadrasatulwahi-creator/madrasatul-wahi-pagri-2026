
<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4b3e"><meta name="description" content="মাদরাসাতুল ওহী পাগড়ি প্রদান অনুষ্ঠান ২০২৬-এর পূর্ণাঙ্গ ডিজিটাল স্মারক">
<title>মাদরাসাতুল ওহী | ডিজিটাল স্মারক ২০২৬</title><style>
@import url('https://fonts.maateen.me/kalpurush/font.css');
:root{
  --green:#0B5443; --maroon:#7A1F2B; --gold:#C9A462; --ivory:#FBF8F1;
  --line:rgba(11,84,67,.16); --fine:rgba(201,164,98,.32); --soft:rgba(11,84,67,.042);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
html,body,button,input,select,textarea,dialog{font-family:'Kalpurush',sans-serif}
body{margin:0;background:var(--ivory);color:var(--green);font-size:15px;line-height:1.85;-webkit-font-smoothing:antialiased}
button,a{ -webkit-tap-highlight-color:transparent }
button{cursor:pointer;font:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.55}
header{position:sticky;top:0;z-index:30;background:rgba(251,248,241,.98);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.head{max-width:1160px;margin:auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:inline-flex;flex-direction:column;color:var(--green);font-size:19px;font-weight:700;line-height:1.45}
.brand small{font-size:11px;letter-spacing:.04em;color:var(--maroon);font-weight:500}
nav{display:flex;gap:5px;align-items:center}
nav button{border:1px solid transparent;background:transparent;border-radius:999px;padding:8px 14px;min-height:44px;color:var(--green);font-size:13px;transition:background .18s,border-color .18s}
nav button:hover,nav button.active{background:var(--green);color:var(--ivory)}
nav button:not(.active):focus-visible{border-color:var(--gold)}
main{max-width:1160px;margin:auto;padding:28px 24px 88px}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;align-items:stretch;background:var(--ivory);border:1px solid var(--line);border-radius:23px;padding:clamp(24px,5vw,66px);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--green) 0 58%,var(--gold) 58% 78%,var(--maroon) 78% 100%)}
.hero-content{position:relative;z-index:1}
.hero-kicker{display:flex;align-items:center;gap:10px;color:var(--maroon);letter-spacing:.05em;font-size:13px;font-weight:700}
.hero-kicker::before{content:"";height:7px;width:7px;background:var(--gold);border-radius:50%}
.hero-arabic{color:var(--green);margin-top:22px;font-family:serif;font-size:19px}
.hero h1{font-family:'Kalpurush',sans-serif;font-weight:700;font-size:clamp(31px,4.6vw,56px);line-height:1.35;margin:15px 0 2px;letter-spacing:-.02em;color:var(--green)}
.hero h2{font-family:'Kalpurush',sans-serif;font-weight:500;font-size:clamp(21px,2.6vw,29px);line-height:1.5;color:var(--maroon);margin:0}
.hero-description{color:var(--green);font-size:14px;margin:17px 0;opacity:.78}
.hero-rule{background:var(--gold);height:2px;width:58px;margin:22px 0}
.hero-meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.meta-item{border-right:1px solid var(--fine);padding-right:14px;font-size:13px;line-height:1.7;display:flex;flex-direction:column}
.meta-item:last-child{border-right:0}
.meta-item span{font-size:11px;color:var(--maroon)}
.hero-action{border:1px solid var(--green);background:var(--green);color:var(--ivory);padding:10px 23px;border-radius:999px;font-size:14px;font-weight:700;min-height:44px;transition:transform .15s,background .15s}
.hero-action:hover{background:var(--maroon);border-color:var(--maroon);transform:translateY(-1px)}
.hero-figure{background:var(--green);border-radius:18px;min-height:320px;color:var(--ivory);padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.hero-figure::before{content:"";position:absolute;inset:12px;border:1px solid rgba(201,164,98,.62);border-radius:11px;pointer-events:none}
.figure-label{color:var(--gold);font-size:13px;z-index:1}
.figure-count{font-family:'Kalpurush',sans-serif;font-size:clamp(80px,11vw,135px);font-weight:700;line-height:1.03;letter-spacing:-.04em;color:var(--ivory);margin:10px 0 0;z-index:1}
.figure-name{font-size:23px;font-weight:700;line-height:1.4;z-index:1}
.figure-date{font-size:12px;opacity:.88;margin-top:28px;color:var(--gold);z-index:1}
.book-banner{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,30px);margin:24px 0 46px;color:var(--green);display:grid;grid-template-columns:1fr 1fr;gap:28px}
.book-banner .quote-item + .quote-item{border-left:1px solid var(--fine);padding-left:24px}
.book-banner .quote-item strong{display:block;font-size:12px;letter-spacing:.04em;color:var(--maroon)}
.book-banner .quote-arabic{font-family:serif;text-align:left;font-size:19px;line-height:2.2;color:var(--green)}
.book-banner p{margin:8px 0 0;font-size:14px;line-height:1.8}
.page-intro{font-family:'Kalpurush',sans-serif;font-size:27px;line-height:1.4;font-weight:700;color:var(--green);margin:36px 0 6px}
.contents-caption{color:var(--maroon);font-size:13px;margin:0 0 20px}
.contents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:0 0 28px}
.chapter{min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:146px;border:1px solid var(--line);background:var(--ivory);padding:19px 20px;border-radius:13px;position:relative;transition:transform .17s,border-color .17s,box-shadow .17s}
.chapter::after{content:"↗";position:absolute;right:18px;top:17px;color:var(--gold);font-size:18px;font-weight:700;transition:transform .17s}
.chapter:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 9px 22px rgba(11,84,67,.07)}
.chapter:hover::after{transform:translate(2px,-2px)}
.chapter .num{color:var(--maroon);font-size:12px;letter-spacing:.07em;font-weight:600}
.chapter strong{color:var(--green);font-size:18px;line-height:1.4;margin:11px 0 5px;padding-right:17px}
.chapter small{color:var(--green);opacity:.75;font-size:12px;line-height:1.6}
.section{margin:12px auto 0;max-width:100%;background:var(--ivory);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,54px);min-height:350px}
.section>h2{font-family:'Kalpurush',sans-serif;font-size:clamp(27px,3vw,35px);font-weight:700;line-height:1.4;margin:0 0 12px;color:var(--green)}
.goldline{width:46px;height:2px;background:var(--gold);margin:0 0 29px}
.reading{max-width:770px;margin:0 auto}
.entry{border-bottom:1px solid var(--line);padding:22px 0 29px}
.entry:last-child{border-bottom:0}
.entry h3{font-family:'Kalpurush',sans-serif;color:var(--maroon);font-size:22px;font-weight:700;line-height:1.5;margin:0 0 13px}
.entry h3::before{content:"";display:inline-block;width:12px;height:2px;background:var(--gold);vertical-align:middle;margin-right:11px}
.entry p{font-size:16px;line-height:2.12;margin:10px 0;white-space:pre-line;color:var(--green)}
.grid-books,.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.person{min-width:0;background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:13px 13px 20px;overflow:hidden;transition:border-color .18s,transform .18s}
.person:hover{border-color:var(--gold);transform:translateY(-2px)}
.portrait{display:block;width:100%;height:275px;object-fit:cover;object-position:center 26%;border-radius:9px;background:var(--soft);margin:0 0 15px}
.portrait.big{max-width:320px;height:350px;object-fit:contain}
.person .name,.person h3{font-weight:700;font-size:19px;color:var(--green);line-height:1.4;margin:0 0 10px}
.person .name::after{content:"";display:block;background:var(--gold);height:2px;width:30px;margin-top:10px}
.person p{font-size:14px;color:var(--maroon);margin:8px 0}
.person dl{margin:0}.person dt{font-size:11px;color:var(--maroon);margin-top:10px}.person dd{font-size:14px;margin:0;color:var(--green);line-height:1.5}
.placeholder{height:275px;border:1px dashed var(--gold);border-radius:9px;background:var(--soft);color:var(--maroon);display:grid;place-items:center;font-size:13px;text-align:center;padding:18px;margin-bottom:15px}
.gallery-card{background:var(--ivory);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0;padding:9px;transition:border-color .18s,transform .18s}
.gallery-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.gallery-card button{display:block;width:100%;border:0;background:transparent;padding:0}
.gallery-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.gallery-card figcaption{padding:10px 5px 3px;font-size:14px;color:var(--green);font-weight:600}
.footcontrols{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:42px 0 0}
.footcontrols button{background:var(--green);border:1px solid var(--green);border-radius:999px;padding:11px 22px;color:var(--ivory);font-size:14px;min-height:44px;transition:background .17s}
.footcontrols button:hover{background:var(--maroon);border-color:var(--maroon)}
.alert{padding:17px 20px;border-left:3px solid var(--gold);background:var(--soft);border-radius:9px;font-size:14px;color:var(--maroon);margin:24px 0;line-height:1.85}
.menu-link{color:var(--maroon);border-bottom:1px solid var(--gold);text-underline-offset:4px}
footer{max-width:1160px;margin:auto;border-top:1px solid var(--line);padding:23px 24px 45px;text-align:center;font-size:12px;color:var(--green);opacity:.79;line-height:1.9}
dialog.modal{border:1px solid var(--line);border-radius:18px;background:var(--ivory);padding:20px;max-height:90vh;max-width:730px;width:90vw;color:var(--green)}
dialog::backdrop{background:rgba(11,84,67,.83)}
.modal img{display:block;max-width:100%;max-height:68vh;object-fit:contain;margin:auto}
.action{display:inline-flex;justify-content:center;align-items:center;border:1px solid var(--green);background:var(--ivory);border-radius:999px;color:var(--green);padding:9px 17px;margin-bottom:15px;font-size:13px}
.action:hover{background:var(--green);color:var(--ivory)}
.smalltag{font-size:13px;color:var(--maroon)}
/* Sponsor presentation — faithful to the printed memorial */
.sponsor-wrap{display:grid;gap:24px;max-width:920px;margin:0 auto}
.sponsor-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fffdf8;box-shadow:0 8px 24px rgba(34,39,31,.06)}
.sponsor-card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--green),var(--gold),var(--maroon))}
.sponsor-head{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:20px;padding:28px 30px 20px}
.sponsor-kicker{font-size:12px;letter-spacing:.06em;color:var(--maroon);font-weight:700}
.sponsor-title{font-size:30px;line-height:1.25;color:var(--green);font-weight:700;margin:5px 0}
.sponsor-subtitle{font-size:13px;color:#76664e}
.sponsor-brandmark{width:100%;max-height:78px;object-fit:contain;object-position:right center}
.sponsor-body{display:grid;grid-template-columns:minmax(0,1fr) 156px;gap:24px;align-items:center;padding:8px 30px 28px}
.sponsor-branches{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sponsor-branch{border:1px solid rgba(11,84,67,.14);background:rgba(11,84,67,.035);border-radius:12px;padding:13px 15px}
.sponsor-branch strong{display:block;color:var(--maroon);font-size:16px;margin-bottom:4px}
.sponsor-branch span{display:block;color:var(--green);font-size:13px;line-height:1.7}
.sponsor-contact{margin-top:15px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sponsor-contact a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 17px;border-radius:999px;border:1px solid var(--green);color:var(--green);font-size:14px;font-weight:700}
.sponsor-contact a.primary{background:var(--green);color:#fffdf8}
.sponsor-qr{text-align:center;border-left:1px solid var(--fine);padding-left:22px}
.sponsor-qr img{width:116px;height:116px;object-fit:contain;background:#fff;padding:5px;border:1px solid var(--line);border-radius:10px}
.sponsor-qr span{display:block;font-size:12px;color:var(--maroon);margin-top:5px}
.sponsor-note{text-align:center;color:#8a795e;font-size:12px;margin:0}
@media(max-width:580px){
 .sponsor-head{grid-template-columns:1fr 100px;padding:22px 18px 14px;gap:10px}
 .sponsor-title{font-size:24px}.sponsor-brandmark{max-height:56px}
 .sponsor-body{grid-template-columns:1fr;padding:8px 18px 20px;gap:17px}
 .sponsor-branches{grid-template-columns:1fr 1fr;gap:8px}
 .sponsor-branch{padding:10px}.sponsor-branch strong{font-size:14px}.sponsor-branch span{font-size:12px}
 .sponsor-qr{border-left:0;border-top:1px solid var(--fine);padding:15px 0 0}
 .sponsor-qr img{width:100px;height:100px}
}

@media(max-width:840px){
 .head{flex-wrap:wrap;gap:8px}.contents{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hero{grid-template-columns:1fr .78fr;padding:32px;gap:18px}
 .hero-figure{min-height:290px}.grid-books{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:580px){
 html{scroll-padding-top:110px}.head{padding:10px 16px}.brand{font-size:17px}.brand small{font-size:10px}
 nav{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}nav button{padding:8px 4px;font-size:12px}
 main{padding:16px 14px 56px}.hero{grid-template-columns:1fr;gap:24px;padding:24px 20px}.hero-arabic{margin-top:13px}.hero h1{font-size:35px}.hero h2{font-size:22px}.hero-figure{min-height:230px;padding:20px}
 .figure-count{font-size:83px}.figure-date{margin-top:12px}.hero-meta{gap:12px}.book-banner{grid-template-columns:1fr;gap:14px;margin:15px 0 28px}.book-banner .quote-item + .quote-item{border-left:0;border-top:1px solid var(--fine);padding:13px 0 0}
 .contents{grid-template-columns:1fr;gap:9px}.chapter{min-height:96px;padding:14px 18px}.chapter strong{margin:3px 0}.page-intro{margin-top:26px}
 .section{padding:22px 17px;border-radius:15px}.grid-books,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .person{padding:8px 8px 13px}.portrait,.placeholder{height:188px}.person .name{font-size:15px}
 .entry h3{font-size:20px}.entry p{font-size:16px;line-height:2.04}
 .gallery-card{padding:5px}.gallery-card figcaption{font-size:12px}
}
@media(max-width:385px){.grid-books,.grid{grid-template-columns:1fr}.portrait,.placeholder{height:310px}.hero h1{font-size:31px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
</style></head>
<body><header><div class="head"><a class="brand" href="#home">মাদরাসাতুল ওহী<small>পাগড়ি প্রদান অনুষ্ঠান · ডিজিটাল স্মারক ২০২৬</small></a><nav aria-label="প্রধান নেভিগেশন"><button type="button" data-go="home">প্রচ্ছদ</button><button type="button" data-go="students">১৪ হাফেজ</button><button type="button" data-go="contents">সূচিপত্র</button><button type="button" data-go="contact">যোগাযোগ</button></nav></div></header>
<main id="app" style="padding-bottom:60px"></main>
<dialog id="photoModal" class="modal"><button id="closePhoto" class="action">বন্ধ করুন ×</button><div id="modalBody"></div></dialog>
<footer>মাদরাসাতুল ওহী · পাগড়ি অনুষ্ঠান স্মারক ২০২৬<br>মূল স্মারকের লেখা যথাসম্ভব অপরিবর্তিতভাবে উপস্থাপিত হয়েছে। অসম্পূর্ণ তথ্য সংশোধনের অপেক্ষায়।</footer>
<script>
const CHAPTERS=[{"id":"foreword","title":"বাণী ও শুভেচ্ছা","glyph":"✦","desc":"সম্পাদকীয়, প্রধান, পরিচালক ও প্রিন্সিপাল","kind":"prose","content":[{"head":"সম্পাদকীয়","body":["আলহামদুলিল্লাহ। মাদরাসাতুল ওহীর পাগড়ি অনুষ্ঠান উপলক্ষে এই স্মারক প্রকাশ করতে পেরে আমরা মহান আল্লাহ তাআলার শুকরিয়া আদায় করছি। কুরআন হিফযের এই অর্জনের সঙ্গে জড়িয়ে আছে শিক্ষার্থীদের অধ্যবসায়, উস্তাদদের নিরলস পরিচর্যা এবং অভিভাবকদের আন্তরিক সহযোগিতা।","পাগড়ি গ্রহণ শিক্ষার্থীর জীবনে একটি স্মরণীয় স্বীকৃতি। এর সঙ্গে যুক্ত হয় অর্জিত হিফজ মজবুতভাবে ইয়াদ রাখা, ধারাবাহিকভাবে তিলাওয়াতের চর্চা চালিয়ে যাওয়া এবং আচরণে কুরআনের শিক্ষা ধারণ করার দায়িত্ব। আমাদের প্রত্যাশা, এই আয়োজন শিক্ষার্থীদের সেই দায়িত্ব পালনে নতুন উৎসাহ দেবে।","এই স্মারকে পাগড়িপ্রাপ্ত শিক্ষার্থীদের পরিচিতি, তাঁদের হিফযের অভিজ্ঞতা, উস্তাদদের স্মৃতি ও নসিহত এবং প্রতিষ্ঠানের শিক্ষাজীবনের কিছু স্মৃতি একসঙ্গে স্থান পেয়েছে। প্রতিষ্ঠানের পরিচিতি ও শিক্ষাপদ্ধতির সংক্ষিপ্ত বিবরণও পাঠককে এই পথচলার পটভূমি জানতে সাহায্য করবে।","শিক্ষার্থী, শিক্ষক, অভিভাবক এবং প্রতিষ্ঠানের কল্যাণকামী সবার প্রতি আমাদের কৃতজ্ঞতা। মহান আল্লাহ তাআলা এই প্রচেষ্টা কবুল করুন এবং শিক্ষার্থীদের ইলম, আমল ও উত্তম চরিত্রে সমৃদ্ধ জীবন দান করুন। আমিন।","সম্পাদক","স্মারক প্রকাশনা পরিষদ"]},{"head":"প্রতিষ্ঠান প্রধানের বার্তা","body":["বিসমিল্লাহির রাহমানির রাহীম","সমস্ত প্রশংসা মহান আল্লাহ তাআলার, যিনি তাঁর পবিত্র কালামের খেদমতের জন্য আমাদের নির্বাচন করেছেন। দরূদ ও সালাম বর্ষিত হোক প্রিয় নবী মুহাম্মদ ﷺ-এর ওপর, যাঁর পবিত্র ওপর নাযিল হয়েছে সর্বশেষ ও সর্বশ্রেষ্ঠ আসমানি গ্রন্থ আল-কুরআন।","আলহামদুলিল্লাহ, মাদরাসাতুল ওহীর ১৪ জন শিক্ষার্থী হিফজুল কুরআন সম্পন্ন করে আজ পাগড়ির সম্মানে ভূষিত হতে যাচ্ছে। আমাদের জন্য এটি কেবল একটি আনুষ্ঠানিক আয়োজন নয়; বরং আল্লাহ তাআলার অশেষ অনুগ্রহ, দীর্ঘ সাধনার এক আনন্দঘন স্বীকৃতি এবং নতুন দায়িত্বের সূচনার দিন।","২০২১ সালে আমরা একটি স্বপ্ন নিয়ে এই প্রতিষ্ঠানের যাত্রা শুরু করি। সেই স্বপ্ন ছিল এমন একটি ঠিকানা গড়ে তোলা, যেখানে কোমলমতি শিশুরা অন্তরে কুরআনের বীজ বপন করবে। যত্ন, মমতা ও সুশৃঙ্খল তালীম-তারবিয়াতের মাধ্যমে সেই বীজ হৃদয়ের গভীরে শিকড় গাড়বে, একদিন মহীরুহে পরিণত হবে এবং তার ফল হিসেবে ফুটে উঠবে ইলম, আমল, আখলাক ও কল্যাণের সমৃদ্ধ জীবন। আজকের এই আয়োজন সেই স্বপ্নের এক উল্লেখযোগ্য বাস্তবায়ন। এর জন্য আমরা মহান আল্লাহ তাআলার দরবারে আন্তরিক শুকরিয়া আদায় করছি।","আমাদের এই নবীন হাফেজদের পথচলা সহজ ছিল না। প্রতিদিন তাহাজ্জুদের সময় জেগে ওঠা, নতুন সবক, সাত-সবক, আমুখতা, তিলাওয়াত, সওয়াল-জবাবের অনুশীলন এবং প্রতি সপ্তাহের সবীনা—এভাবেই অসংখ্য দিনের নীরব পরিশ্রম জমা হয়ে আজকের এই অর্জনে রূপ নিয়েছে। পাগড়ি সেই পরিশ্রমের একটি বিনম্র স্বীকৃতি মাত্র; এটি হিফজের সমাপ্তি নয়, বরং কুরআনের আমানত রক্ষার নতুন দায়িত্বের সূচনা। আমাদের প্রত্যাশা, এই সন্তানেরা কুরআনের আলো নিজেদের চরিত্র, আচরণ ও কর্মের মাধ্যমে মানুষের কাছে পৌঁছে দেবে।","সম্মানিত অভিভাবকবৃন্দের প্রতি আমাদের কৃতজ্ঞতা অপরিসীম। আপনারা নিজেদের কলিজার টুকরাকে দীর্ঘ সময় আমাদের আমানত হিসেবে অর্পণ করেছেন, ধৈর্য ধারণ করেছেন, দোয়া করেছেন এবং আমাদের ওপর আস্থা রেখেছেন। আল্লাহ তাআলা আপনাদের এই ত্যাগ ও ভালোবাসাকে উত্তম প্রতিদানে কবুল করুন।","শ্রদ্ধেয় উস্তাদগণও আমাদের গভীর কৃতজ্ঞতার দাবিদার। তাঁরা শুধু পাঠদানেই সীমাবদ্ধ থাকেননি; বরং প্রতিটি শিক্ষার্থীকে আপন সন্তানের মতো স্নেহ, ধৈর্য ও দায়িত্ববোধের সঙ্গে গড়ে তুলেছেন। তাঁদের এই নিরলস মেহনতের প্রকৃত প্রতিদান একমাত্র আল্লাহ তাআলাই দান করতে পারেন। প্রতিষ্ঠানের এই পথচলায় যাঁরা পরামর্শ, সহযোগিতা ও দোয়ার মাধ্যমে পাশে থেকেছেন, তাঁদের প্রতিও আন্তরিক কৃতজ্ঞতা জানাই।","আমরা জানি, আমাদের পথচলা এখনো অনেক বাকি। আত্মমূল্যায়ন, ধারাবাহিক উন্নয়ন এবং আল্লাহ তাআলার তাওফিকের ওপর ভরসা রেখে আমরা সামনে এগিয়ে যেতে দৃঢ়প্রতিজ্ঞ, ইনশাআল্লাহ।","মহান আল্লাহর কাছে আমাদের আন্তরিক প্রার্থনা—তিনি যেন এই সন্তানদের কুরআনের সত্যিকারের ধারক ও বাহক হিসেবে কবুল করেন, তাঁদের ইলম, আমল ও চরিত্রে বরকত দান করেন এবং তাঁদের মাধ্যমে দ্বীন, দেশ ও মানবতার কল্যাণ সাধন করেন। আমিন।","—বিভাগীয় প্রধান ও পরিচালক","মাদরাসাতুল ওহী","১০ ডিসেম্বর ২০২৬"]},{"head":"ডিরেক্টরের বাণী","body":["মাদরাসাতুল ওহী: কুরআনের খেদমতে এক স্বপ্নের পথচলা","একটি প্রয়াস, সদকায়ে জারিয়ার এক আকাঙ্ক্ষা","بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","মহান আল্লাহর সন্তুষ্টির আশায় পবিত্র কুরআনের খেদমত করাই মাদরাসাতুল ওহী (ব্রাইট স্কলার) প্রতিষ্ঠার মূল উদ্দেশ্য। আমি চেয়েছি, এখানে শিক্ষার্থীরা বিশুদ্ধভাবে কুরআন তিলাওয়াত শিখুক ও হিফজ করুক। এ উদ্যোগের মাধ্যমে একজন মানুষও বিশুদ্ধভাবে কুরআন পড়তে শিখলে, তা আমার জন্য বড় প্রাপ্তি।","আমার স্বপ্ন এমন একটি প্রজন্ম গড়ে তোলা, যাদের হৃদয়ে থাকবে কুরআন, জীবনে থাকবে সুন্নাহ। তারা সত্যবাদী ও আমানতদার হবে এবং পরিবার ও সমাজের কল্যাণে কাজ করবে। শিক্ষার্থীরা যখন কুরআনের শিক্ষা নিজেদের জীবনে ধারণ করবে ও পরবর্তী প্রজন্মের কাছে পৌঁছে দেবে, তখনই এ প্রতিষ্ঠান সার্থক হবে।","আমি চাই, আমার মৃত্যুর পরও এ প্রতিষ্ঠানে কুরআনের শিক্ষা চলতে থাকুক। আল্লাহ তাআলা এ প্রয়াসকে আমার জন্য সদকায়ে জারিয়া হিসেবে কবুল করুন। এ স্বপ্ন পূরণে শিক্ষক, অভিভাবক ও শুভাকাঙ্ক্ষীদের আন্তরিক সহযোগিতা ও দোয়া কামনা করি।","আল্লাহ তাআলা আমাদের নিয়ত বিশুদ্ধ করুন, এখান থেকে কুরআনের খাদেম গড়ে তুলুন এবং কিয়ামত পর্যন্ত এ প্রতিষ্ঠানকে কুরআন ও সুন্নাহর শিক্ষা ছড়িয়ে দেওয়ার বরকতময় মাধ্যম হিসেবে টিকিয়ে রাখুন। এর সঙ্গে সম্পৃক্ত সবাইকে উত্তম প্রতিদান দিন।","আমিন, ইয়া রব্বাল আলামিন।","মাওলানা জুনাইদ হোসেন, প্রতিষ্ঠাতা পরিচালক, ব্রাইট স্কলার"]},{"head":"প্রিন্সিপালের বাণী","body":["\"শিক্ষার আলোয় আলোকিত, সৃষ্টির সেরা মানব গড়ি\"","সমস্ত প্রশংসা আল্লাহ তাআলার যিনি একক ও অদ্বিতীয়। সালাত ও সালাম মানবতার মুক্তির দূত উম্মতের কান্ডারী নবী মুহাম্মাদুর রাসুলুল্লাহ (সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম) এর ওপর।","মহান আল্লাহ তাআলার প্রথম নির্দেশনা “পড়”। যে যত পড়ে সে তত জানে। সঠিক জ্ঞান অর্জন করা তথা উপকারী ইলম অর্জন করা অত্যন্ত গুরুত্বপূর্ণ বিষয়। আর সেই লক্ষ্যেই  ব্রাইট স্কলার ২০২১ সালে আত্মপ্রকাশ করেছে যখন অনেক প্রতিষ্ঠান বন্ধ হয়ে যাচ্ছিল করোনার ভয়াল থাবার কারণে। সেই কঠিন সময়ে এক ঝাঁক তরুণ আলেম বাংলাদেশ ও আমাদের প্রাণের ধর্ম ইসলামকে একযোগে বিশ্ব মঞ্চে তুলে ধরার স্বপ্ন বাস্তবায়নের লক্ষ্যে ব্রাইট স্কলার একটি সমন্বিত শিক্ষা প্রতিষ্ঠান প্রতিষ্ঠা করেছে। ব্রাইট স্কলার একটি ইসলামিক স্কুল ও বিশ্বমানের হিফযুল কুরআন শিক্ষা প্রতিষ্ঠান, যেখানে ইসলাম ও সাধারণ শিক্ষার সমন্বয়ে প্রতিটি শিশু পাবে যুগোপযোগী শিক্ষা। আমাদের প্রতিষ্ঠান প্রতিটি শিশুকে সঠিক জ্ঞান, ইসলামী নৈতিকতা এবং সৃজনশীলতার মাধ্যমে বিশ্বমঞ্চে তুলে ধরার লক্ষ্যে কাজ করছে। আমরা প্রতিটি শিক্ষার্থীর মধ্যে মানবিক গুণাবলী ও নেতৃত্বের ক্ষমতা গড়ে তুলতে প্রতিশ্রুতিবদ্ধ, যাতে তারা সমাজের উন্নয়ন ও শান্তির জন্য কাজ করতে পারে।","আমরা বাংলাদেশের সংস্কৃতি ও ইসলামী ঐতিহ্যকে গর্বের সাথে তুলে ধরতে প্রস্তুত। আমরা বিশ্বাস করি, সঠিক শিক্ষা ও ইসলামী মূল্যবোধের সমন্বয়ে আমাদের শিক্ষার্থীরা হতে পারে বিশ্বনাগরিক এবং সাফল্যের প্রতীক। আমরা বিশ্বাস করি, প্রতিটি শিক্ষার্থী হলো সম্ভাবনার এক অনন্য চিত্র, যারা নিজেদের দক্ষতা ও মূল্যবোধের ভিত্তিতে বিশ্ব মঞ্চে মাথা উঁচু করে দাঁড়াবে।","চলুন, আমরা একসাথে একটি নতুন প্রজন্মের নেতৃত্ব গড়ে তুলি, যারা হবে বিশ্বের জন্য অনুপ্রেরণা। অভিভাবক মণ্ডলীর দোয়া ও সার্বিক সহযোগিতা আমাদের পথ চলার পাথেয় হবে। শিক্ষার বৈপ্লবিক এ ধারাকে অগ্রগামী করার জন্য সকলের নিকট দোয়া কামনা করছি এবং মহান রাব্বুল আলামীনের নিকট তা বাস্তবায়ন করার ক্ষেত্রে সাহায্য চাই। আল্লাহ আমাদের এ প্রয়াস কবুল করুন, আমিন।","মুফতী সাইফুল ইসলাম, প্রিন্সিপ্যাল, ব্রাইট স্কলার"]},{"head":"চেয়ারম্যান ও অতিথিদের বাণী","body":["মূল স্মারকে কিছু বাণীর জন্য অনুমোদিত লেখা ও পরিচয় সংযোজনের স্থান সংরক্ষিত রয়েছে। তাই অসম্পূর্ণ বক্তব্য তৈরি করে প্রকাশ করা হয়নি।"]}]},{"id":"students","title":"আমাদের ১৪ হাফেজ","glyph":"♛","desc":"১৪ জনের ছবি, পরিচয়, হিফজের তথ্য ও রক্তের গ্রুপ","kind":"students"},{"id":"reflections","title":"শিক্ষার্থীদের অনুভূতি","glyph":"❁","desc":"৯ জনের মূল লেখা","kind":"prose","content":[{"head":"রায়ান কবির রাখশান","body":["সমস্ত প্রশংসা সেই মহান রবের জন্য, যিনি তালিবে ইলম বানিয়ে আমায় ধন্য করেছেন। জীবনে বন্ধু হিসেবে অনেককেই পেয়েছি, পেয়েছি বড় ভাই হিসেবেও। মমতাময়ী মা-বাবা, ভাই, আত্মীয়-স্বজন ও সকল শুভাকাঙ্ক্ষীর প্রতি চিরকৃতজ্ঞতা জানাই। তাঁদের সহযোগিতা ও অনুপ্রেরণায় আজ এত কিছু অর্জন করতে পেরেছি।","শোধ করার মতো নয় উস্তাদদের ঋণ, যাঁদের পরশে পেয়েছি ঐশী আলোকবর্তিকা। আমার শেষ নিবেদন, আমার অযাচিত কথা ও কাজে কষ্ট পেয়ে থাকলে ক্ষমা করে দেবেন। দোয়া করি, জান্নাতে যেন আমাদের মিলনমেলা হয়। পরস্পরের মধ্যে সুসম্পর্ক, সৌহার্দ্য ও ভ্রাতৃত্বের বন্ধন অটুট রাখার তাওফিক রবের কাছে কামনা করি।"]},{"head":"মোঃ জুনায়েদ সিদ্দিক ঢালী","body":["বন্ধু, বছরখানেক আগে এক স্বপ্ন নিয়ে মাদরাসায় এসেছিলাম। মানুষ হওয়ার স্বপ্ন, সাহাবাদের মতো মানুষ। বলতে দ্বিধা নেই, আমার এ স্বপ্ন পূরণে শ্রদ্ধেয় উস্তাদগণ, সম্মানিত পিতা-মাতা ও দূর-কাছের প্রিয়জনরা চেষ্টার কোনো ত্রুটি রাখেননি। আমি তাঁদের প্রতি চিরকৃতজ্ঞ, চিরঋণী। আজও সেই স্বপ্ন লালন করি, বুকের মধ্যে ধারণ করি। আল্লাহ আমার স্বপ্নকে কবুল করুন। তাঁদের ওপর রহম করুন। দুনিয়া ও আখিরাতের পথ আমাদের জন্য সহজ ও নিরাপদ করুন। আমিন।"]},{"head":"মোঃ আয়াত বিন বাশার","body":["সবার আগে শুকরিয়া আদায় করছি মহান আল্লাহর, যিনি আমাকে আজ এই পর্যন্ত আসার তাওফিক দিয়েছেন। আলহামদুলিল্লাহ। কৃতজ্ঞতা জানাই শ্রদ্ধেয় উস্তাদ, মুরব্বি ও মা-বাবার প্রতি, যাঁদের দোয়া ও মেহনতে আজ আল্লাহর এত বড় নিয়ামত অর্জন করতে পেরেছি। ধন্যবাদ জানাই সাথি-সঙ্গীদের, যাঁদের সঙ্গে জীবনের অনেকটা পথ চলেছি। আল্লাহ সবাইকে কবুল করুন। আমিন। আসসালামু আলাইকুম।"]},{"head":"মোঃ আব্দুল্লাহ জাকওয়ান","body":["মহান মালিকের শুকরিয়া আদায় করছি। পড়ন্ত বেলায় খুব মনে পড়ছে প্রিয় বাবা-মা, আত্মীয়-স্বজন, আসাতিযায়ে কেরাম ও শুভাকাঙ্ক্ষীদের। তাঁদের অকৃত্রিম ভালোবাসা, দোয়া ও সুমধুর শাসনেই আমার বেড়ে ওঠা। পরিশেষে প্রভুর দরবারে প্রিয়জনদের কল্যাণ কামনা করছি।"]},{"head":"মূসা আবরার","body":["সমস্ত প্রশংসা মহান আল্লাহ তাআলার জন্য। কৃতজ্ঞতা জানাই পরম প্রিয় পিতা-মাতা, ভাই-বোন, আত্মীয়-স্বজন ও উস্তাদগণের প্রতি। তাঁদের দোয়া, ভালোবাসা, অক্লান্ত পরিশ্রম ও উত্তম রাহনুমায়ীর মাধ্যমে আমি কুরআন মাজিদ হিফজ সম্পন্ন করতে পেরেছি। আলহামদুলিল্লাহ। আল্লাহ তাঁদের জাযায়ে খায়ের দান করুন।"]},{"head":"সাইফুল্লাহ সাফওয়ান","body":["সমস্ত প্রশংসা আল্লাহ তাআলার, যিনি আমাকে ইলমে ওহীর বাহক হিসেবে কবুল করেছেন। কৃতজ্ঞতা জানাই আমার পিতা-মাতা ও বড় ভাইদের প্রতি, যাঁদের নিরলস পরিশ্রম ও সহযোগিতায় আমার এ পথে চলা সুগম হয়েছে। ধন্যবাদ জানাই মাদরাসাতুল ওহীর আসাতিযায়ে কেরাম ও সহপাঠীদের, যাঁদের সাহচর্য আমাকে অনুপ্রাণিত করেছে। আল্লাহ সবাইকে উত্তম বদলা দান করুন। আমিন।"]},{"head":"মোঃ আনাস আব্দুল্লাহ","body":["বেলা শেষে এসে অনুভূতির তালিকা সাজাতে বসলে তা অল্প কথায় শেষ হওয়ার নয়। সংক্ষেপে বলতে গেলে, আল্লাহ ও তাঁর রাসুলের পরে চিরকৃতজ্ঞতা জানাই পিতা-মাতা ও ভাই-বোনদের প্রতি। তাঁদের উৎসাহ ও শুভকামনায় আজকের এই আলোকময় পথের পথিক আমি।","অফুরন্ত ভালোবাসা শিক্ষকবৃন্দ ও সহপাঠীদের জন্য, যাঁদের সান্নিধ্যে দীর্ঘ সময় আনন্দে পার করেছি। প্রিয় মাদরাসাতুল ওহীর প্রতি ভালোবাসার ছবিও হৃদয়ে আঁকা। অশ্রুসিক্ত প্রতিটি প্রার্থনায় কামনা করি, তোমরা বেঁচে থাকো হাজার বছর।"]},{"head":"মোঃ মাহির আহমাদ নূর","body":["শুকরিয়া জানাই রব্বে কাবার। কৃতজ্ঞচিত্তে স্মরণ করি শ্রদ্ধেয় পিতা-মাতা ও পিতৃতুল্য উস্তাদগণকে। তাঁদের রাহনুমায়ি, নেক দোয়া ও প্রচেষ্টায় আমার এ পর্যন্ত বেড়ে ওঠা। আল্লাহ তাঁদের জাযায়ে খায়ের দান করুন।","কৃতজ্ঞতা জানাই প্রিয় সহপাঠীদের, যাঁদের সঙ্গে দীর্ঘ সময় পার করেছি। সর্বোপরি সবার জন্য কামনা করি প্রভুর করুণা। সবার কাছে দোয়াই আমার একান্ত কাম্য।"]},{"head":"মোহাম্মদ আরিয়ান ইসলাম","body":["সমস্ত প্রশংসা মহান রব্বুল আলামিনের জন্য, যিনি আমাকে ইলমে ওহীর বাহক হিসেবে কবুল করেছেন। আলহামদুলিল্লাহ। শিক্ষাজীবনের একটি গুরুত্বপূর্ণ অধ্যায়ের সমাপনীতে বিদায়ের বেদনায় মন ভারাক্রান্ত। হৃদয় থেকে শ্রদ্ধা ও কৃতজ্ঞতা জানাই আমার প্রাণপ্রিয় উস্তাদগণ, বাবা-মা ও প্রিয় সহপাঠীদের প্রতি।","বিশেষ করে উস্তাদগণ ও বাবা-মায়ের স্নেহ, শাসন ও নেক দোয়ার উসিলায় আজ এ পর্যন্ত আসতে পেরেছি। মাদরাসার সংশ্লিষ্ট সবার সহযোগিতা ও অক্লান্ত পরিশ্রম আমার ইলম অর্জনের পথ সহজ করেছে। মহান রব্বুল আলামিনের কাছে দোয়া করি, তিনি যেন তাঁদের সবাইকে জান্নাতুল ফেরদাউসের উচ্চ মাকাম নসিব করেন। তাঁদের এই পরিশ্রমের ঋণ শোধ করা সম্ভব নয়। ভারাক্রান্ত হৃদয়ে বলছি, বিদায় হে মাদরাসাতুল ওহী।"]}]},{"id":"parents","title":"অভিভাবকের অনুভূতি","glyph":"♡","desc":"৫ জনের মূল লেখা","kind":"prose","content":[{"head":"মোহাম্মদ কবির আহমেদ","body":["শিক্ষার্থী: রায়ান কবির রাখশান  |  সম্পর্ক: পিতা","পরম করুনাময় অসীম দয়ালু আল্লাহর নামে শুরু করছি।","আজকের এই পবিত্র ও বরকতময় ক্ষণে  আমাদের মনের ভিতরের আনন্দ, উচ্ছ্বাস আর কৃতজ্ঞতা প্রকাশ করার মত ভাষা আমাদের  জানা নেই। মহান আল্লাহ সুবহানাহু তাআলার দরবারে লাখো-কোটি শুকরিয়া, যিনি আমাদের মতো গুনাহগার বান্দাদের তার পবিত্র কালামের একজন হাফেজের পিতা-মাতা হওয়ার মহান গৌরব দান করেছেন। একই সাথে সালাত ও সালাম প্রিয় নবী হযরত মোহাম্মদ সাল্লাল্লাহু আলাইহি ওয়াসাল্লামের প্রতি। যার মাধ্যমে আমরা  পবিত্র গ্রন্থ  আল কোরআন পেয়েছি।","রায়ান কবির রাখশানের মাথায়  হাফেজী পাগড়ী পড়িয়ে দেওয়ার  দৃশ্যটি আমাদের জীবনের শ্রেষ্ঠ প্রাপ্তি ও  পরম আনন্দের। সন্তানদের কোরআনের হাফেজ/আলেম হিসেবে গড়ে তোলার স্বপ্নটি যেদিন বুকে ধারন করেছিলাম, সেদিন থেকেই এক ধরনের ব্যাকুলতা কাজ করতো। আজ সেই স্বপ্নের বাস্তব রূপ দেখে আমাদের চোখ দুটো আনন্দের অশ্রুতে ভিজে উঠছে।","এই মহান অর্জনের পিছনে যাদের অক্লান্ত পরিশ্রম, ধৈর্য আর ভালোবাসা জড়িয়ে আছে তারা হলেন মাদরাসাতুল ওহীর সম্মানিত উস্তাদজীগণ । অত্র  প্রতিষ্ঠানের সকল শিক্ষক ও সংশ্লিষ্ট কর্তৃপক্ষকে আমাদের অন্তরের অন্তস্থল থেকে মোবারকবাদ ও কৃতজ্ঞতা জানাই। আপনাদের দিন-রাত মেহনত আর সঠিক দিক নির্দেশনা ছাড়া আমাদের সন্তানের পক্ষে আল্লাহর এই পবিত্র আমানত সিনায় ধারন করা সম্ভব হতোনা। আল্লাহ আপনাদের এই দ্বীনি খেদমতকে 'কবুল করুন এবং উত্তম জাযা দান করুন।","আমরা আমাদের স্নেহের সন্তান হাফেজ রায়ান কবির রাখশানের জন্য দোয়া করি, আল্লাহ যেন তাকে কোরআনের আলোয় নিজের জীবনকে আলোকিত করার তাউফিক দান করেন। সে যেন শুধু মুখস্থকারী না হয়ে কোরআনের আদেশ-নিষেধ মেনে একজন সত্যিকারের আদর্শ মানুষ ও মুখলিস আলেম হতে পারে।","সবশেষে, এই স্মারক গ্রন্থের  মাধ্যমে আমরা সকলের কাছে আমাদের সন্তানের জন্য দোয়া প্রার্থী। আল্লাহ যেন মাদরাসাতুল ওহীকে দ্বীনের এক মজবুত কেল্লা হিসেবে কিয়ামত পর্যন্ত  কবুল ও মঞ্জুর করেন, আমীন।"]},{"head":"মাহমুদা নাসরীন","body":["শিক্ষার্থী: হাফেজ জুনায়েদ সিদ্দিক ঢালী   সম্পর্ক: মা","যাবতীয় প্রশংসা একমাত্র মহান আল্লাহ তাআলার, যিনি আমার সন্তানকে পবিত্র কুরআনের মহান আমানত বুকে ধারন করার তৌফিক দান করেছেন। দুরুদ ও সালাম বর্ষিত হোক মানবতার মুক্তিদূত বিশ্বনবী হযরত মুহাম্মদ (সাঃ)-এর প্রতি।","ব্রাইট স্কলার মাদরাসাতুল ওহী মাদ্রাসার পাগড়ি প্রদান স্মারকে কিছু লেখার সুযোগ পেয়ে আমি অত্যন্ত আনন্দিত। একজন মুসলিম মাতা হিসাবে সন্তানকে হাফেজে কুরআন হিসেবে দেখা আমার জীবনের সবচেয়ে বড় স্বপ্নছিল। আজ আমার সন্তান জুনায়েদ সিদ্দিক ঢালী যখন পবিত্র কুরআন হিফজ সম্পন্ন করেছে, তখন \"মা\" হিসেবে আমার বুক এক অনাবিল শান্তিতে ভরে উঠেছে।","এই অর্জনের পেছনে সবচেয়ে বড় অবদান এই মাদরাসার সম্মানিত উস্তাদজণের। বিশেষ করে মাদ্রাসার সম্মানিত মুহতামিম সাহেব এর কথা না বললেই নয়। মাদ্রসার সকল উস্তাজগণের অক্লান্ত পরিশ্রম, স্নেহ এবং সুশৃঙ্খল গাইড লাইন সত্যিই প্রশংসার দাবিদার। অন্য সকল দ্বীনি ভাই ও বোনদের প্রতি আমার অনুরোধ, আসুন আমরা আমাদের সন্তানকে দুনিয়াবি শিক্ষার পাশাপাশি  দ্বীনি শিক্ষায় শিক্ষিত করি।","পরিশেষে, আমি আমার হাফেজ সন্তানের জন্য সবার কাছে দোয়া চাই। আল্লাহ যেন তাকে কোরআনের আলো অনুযায়ী জীবন গড়ার তৌফিক-দান করেন এবং এই মাদ্রাসাকে দ্বীনের একটি বড় মারকাজ হিসেবে কবুল করেন। আমিন।"]},{"head":"জহিরুল ইসলাম","body":["শিক্ষার্থী: আব্দুল্লাহ জাকওয়ান  |  সম্পর্ক: বাবা","সমস্ত প্রশংসা মহান আল্লাহ তাআলার, যিনি আমার সন্তানকে পবিত্র কুরআন বুকে ধারণ করার তাওফিক দিয়েছেন। একটি বর্ণনায় এসেছে, যে ব্যক্তি কুরআন পড়ে ও সে অনুযায়ী আমল করে, কিয়ামতের দিন তার পিতা-মাতাকে সূর্যের আলোর চেয়েও দীপ্তিময় এক মুকুট পরানো হবে (সুনানে আবু দাউদ, ১৪৫৩)।","মাদরাসাতুল ওহী এর সম্মানিত উস্তাজদের প্রতি আমি চিরকৃতজ্ঞ। হরফ চেনা থেকে পুরো কুরআন হিফজ করা পর্যন্ত তাঁরা আমার সন্তানকে পরম যত্ন, ধৈর্য ও স্নেহে পথ দেখিয়েছেন। মাদরাসার শান্ত দ্বীনি পরিবেশে সে উত্তম চরিত্র গড়ার শিক্ষা পেয়েছে। এই প্রতিষ্ঠান ও তার ছাত্রাবাসের প্রতি আমার হৃদয়ের টান আজীবন থাকবে।","আমার কাছে দুনিয়ার সব সম্পদের চেয়েও মূল্যবান আমার সন্তানের হাফেজ হওয়ার এই নিয়ামত। আল্লাহ যেন এই অর্জনকে তার ও আমাদের জন্য সদকায়ে জারিয়া এবং আখিরাতে নাজাতের উসিলা করেন। আমার সন্তান ও তার সহপাঠী, মাদরাসাতুল ওহী এবং এর সকল উস্তাদের কল্যাণ ও সফলতার জন্য দোয়া করি। আমিন।"]},{"head":"মোঃ রফিকুল ইসলাম","body":["শিক্ষার্থী: মাহির আহমাদ নূর  |  সম্পর্ক: বাবা","বিসমিল্লাহির রাহমানির রাহিম","প্রিয় পুত্র মাহির আহমাদ নূরের প্রতি","পিতার হৃদয়ের গভীর থেকে কিছু কথা","প্রিয় মাহির আহমাদ নূর","আলহামদুলিল্লাহ! আজ আমার জীবনের অন্যতম আনন্দের ও গর্বের দিন। তোমার মাথায় পাগড়ী উঠতে যাচ্ছে। পবিত্র কুরআনের ৩০ পারা বুকে ধারণ করে তুমি আজ জীবনের এক মহৎ অধ্যায় অতিক্রম করেছ। এই অর্জন শুধু তোমার একার নয়, এটি আমাদের পরিবারের জন্য মহান আল্লাহর এক অমূল্য নিয়ামত।","বাবা, মনে আছে তোমার শৈশবের সেই দিনগুলোর কথা? কত স্বপ্ন, কত আশা আর কত দোয়া নিয়ে তোমাকে দ্বীনি শিক্ষার পথে এগিয়ে দিয়েছিলাম। আজ সেই স্বপ্নের একটি সুন্দর বাস্তব রূপ দেখতে পাচ্ছি। তোমার এই সাফল্যে আমার হৃদয় আনন্দে আপ্লুত। মহান আল্লাহর দরবারে লাখো শুকরিয়া।","মনে রেখো, হাফেজ হওয়া শুধু একটি উপাধি নয়; এটি এক বিশাল আমানত ও আজীবনের দায়িত্ব। পবিত্র কুরআন শুধু মুখস্থ রাখার জন্য নয়, বরং নিজের জীবনে ধারণ করার জন্য। তোমার প্রতিটি কথা, কাজ, আচরণ ও চরিত্রে যেন কুরআনের শিক্ষা প্রতিফলিত হয়।","বাবা, তোমার মাথার এই পাগড়ী যেন কখনো অহংকারের কারণ না হয়; বরং বিনয়, তাকওয়া, আদব, আমানতদারি ও দ্বীনের প্রতি দায়িত্ববোধের প্রতীক হয়ে থাকে। তুমি কুরআনের আলোয় নিজের জীবন আলোকিত করবে এবং সেই আলো মানুষের মাঝে ছড়িয়ে দেবে—এটাই আমার প্রত্যাশা।","জীবনের পথে অনেক বাধা আসবে, অনেক কঠিন সময়ের মুখোমুখি হতে হবে। কখনো হতাশ হয়ো না। সর্বদা আল্লাহর ওপর ভরসা রেখো। কুরআনের সঙ্গে তোমার সম্পর্ক যেন কখনো বিচ্ছিন্ন না হয়। জীবনের শেষ নিঃশ্বাস পর্যন্ত কুরআনের খাদেম হয়ে থেকো।","একজন বাবা হিসেবে তোমার কাছে আমার সবচেয়ে বড় চাওয়া—তুমি শুধু একজন হাফেজে কুরআন হয়েই থেমে থেকো না; বরং কুরআনের প্রকৃত অনুসারী, উত্তম চরিত্রের অধিকারী, নেককার মানুষ এবং দ্বীনের একনিষ্ঠ খাদেম হয়ে ওঠো।","হে আমার রব! আমার সন্তান মাহির আহমাদ নূরকে কুরআনের আলোয় আলোকিত রাখুন। তার মুখস্থ করা প্রতিটি আয়াতকে তার জীবনের পাথেয় বানিয়ে দিন। তাকে ইলমে নাফে, আমলে সালেহ, উত্তম আখলাক ও তাকওয়া দান করুন। কুরআনকে তার হৃদয়ের প্রশান্তি, জীবনের পথপ্রদর্শক এবং আখিরাতের নাজাতের উসিলা বানিয়ে দিন। তাকে দুনিয়া ও আখিরাতে সম্মানিত করুন এবং আমাদের জন্য সদকায়ে জারিয়া হিসেবে কবুল করুন। আমিন।","শেষ কথা","নূর, তোমার মাথায় আজ যে পাগড়ী উঠবে, সেটি আমার কাছে শুধু একটি সম্মানের স্মারক নয়; এটি আমার বহু বছরের স্বপ্ন, দোয়া ও ভালোবাসার প্রতিচ্ছবি।","তোমার জন্য আমার দোয়া কখনো শেষ হবে না। তুমি যেখানেই থাকো, যে অবস্থাতেই থাকো, কুরআনকে আঁকড়ে ধরে থেকো।","তোমাকে নিয়ে আজ আমি গর্বিত, আল্লাহর কাছে কৃতজ্ঞ এবং তোমার উজ্জ্বল আখিরাতের প্রত্যাশায় আশাবাদী।","অনেক অনেক দোয়া, স্নেহ ও অফুরন্ত ভালোবাসা রইল।","ইতি,","তোমার গর্বিত বাবা।"]},{"head":"শামীমা আক্তার","body":["শিক্ষার্থী: সাইফুল ইসলাম সোহাম | সম্পর্ক: মা","বিসমিল্লাহির রাহমানির রাহিম।","আসসালামু আলাইকুম ওয়া রহমাতুল্লাহ।","আজ আমার জীবনের অত্যন্ত আনন্দের একটি দিন। আজকের এই আনন্দ ভাষায় প্রকাশ করার মতো নয়।","একজন মা হিসেবে আজ আমার বুকটা আনন্দে ভরে গেছে। আমার ছেলে পবিত্র কুরআনের ৩০ পারা মুখস্থ করে হাফেজ হওয়ার সৌভাগ্য অর্জন করেছে। আলহামদুলিল্লাহ, লাখো শুকরিয়া মহান আল্লাহর দরবারে।","এই পথটা সহজ ছিল না। আমার সন্তানের পরিশ্রম, শিক্ষকদের অক্লান্ত চেষ্টা, মাদ্রাসার স্নেহ ও শাসন এবং আমাদের সবার দোয়ার বরকতে আজকের এই সুন্দর অর্জন।","আমি বিশেষভাবে কৃতজ্ঞতা জানাই আমার সন্তানের সম্মানিত ওস্তাদদের প্রতি। যাঁরা আমার সন্তানকে কুরআনের আলোয় আলোকিত করেছেন। তাঁদের এই অবদান আমি কখনো ভুলব না।","আজ আমি শুধু আমার ছেলের জন্য আনন্দিত নই, আমি আল্লাহর কাছে শুকরিয়া আদায় করছি যে তিনি আমাকে এমন একটি সৌভাগ্যের দিন দেখিয়েছেন।","আমার ছেলের কাছে আমার একটাই চাওয়া—বাবা, তুমি শুধু কুরআনের হাফেজ হয়েই থেকো না, কুরআনকে নিজের জীবনে ধারণ করো। কুরআনের আদর্শে নিজেকে গড়ে তোলো। মানুষের ভালোবাসা অর্জন করো এবং দ্বীনের খেদমত করো।","সবাই আমার ছেলের জন্য দোয়া করবেন, আল্লাহ যেন তাকে কুরআনের প্রকৃত খাদেম হিসেবে কবুল করেন এবং কুরআনকে আমাদের সবার নাজাতের উসিলা বানিয়ে দেন।","সবশেষে বলব, আজ আমার মাথা গর্বে নয়, আল্লাহর শুকরিয়ায় নত হয়ে আছে।","আল্লাহ আমাদের সন্তানদের দ্বীনের পথে কবুল করুন।","আমিন।"]}]},{"id":"institution","title":"প্রতিষ্ঠান ও শিক্ষাদর্শ","glyph":"⌂","desc":"পরিচিতি, শিক্ষা কার্যক্রম ও পথচলা","kind":"prose","content":[{"head":"আমাদের পরিচিতি","body":["মাদরাসাতুল ওহী ব্রাইট স্কলারের তত্ত্বাবধানে পরিচালিত একটি দ্বীনি শিক্ষাপ্রতিষ্ঠান। ব্রাইট স্কলারের যাত্রা শুরু হয় ২০২১ সালে। প্রাথমিক পর্যায়ে শিশু শ্রেণি থেকে পঞ্চম শ্রেণি পর্যন্ত NCTB নির্ধারিত শিক্ষাক্রমের পাশাপাশি নিজস্ব প্রণীত ইসলামি শিক্ষা সিলেবাসের সমন্বয়ে প্রতিষ্ঠানটির শিক্ষা কার্যক্রম শুরু হয়। ‘ধর্মীয় পরিবেশে আধুনিক শিক্ষা’—এই প্রত্যয়কে ধারণ করে শুরু থেকেই আমাদের লক্ষ্য ছিল সাধারণ ও ধর্মীয় শিক্ষার সমন্বয়ে একটি সুশিক্ষিত প্রজন্ম গড়ে তোলা।","এই ধারাবাহিকতায় ২০২২ সালের আগস্ট মাস থেকে হিফজুল কুরআনকেন্দ্রিক আনুষ্ঠানিক কার্যক্রম শুরু হয়। কুরআনের নূর, উত্তম চরিত্র ও প্রয়োজনীয় আধুনিক শিক্ষার সমন্বয়ে জ্ঞান, নৈতিকতা ও মননশীলতায় সমৃদ্ধ একটি আলোকিত প্রজন্ম গড়ে তোলার প্রত্যয় নিয়েই আমাদের পথচলা।","আমরা বিশ্বাস করি, কুরআন হিফজ করা নিঃসন্দেহে এক মহিমান্বিত অর্জন; তবে প্রকৃত সাফল্য কেবল কুরআন মুখস্থ করার মধ্যে সীমাবদ্ধ নয়। বরং সেই কুরআনের প্রতি গভীর ভালোবাসা হৃদয়ে ধারণ করা এবং জীবনের প্রতিটি ক্ষেত্রে নববী আদর্শের প্রতিফলন ঘটানোই একজন শিক্ষার্থীর প্রকৃত সার্থকতা।"]},{"head":"আমাদের শিক্ষাদর্শ","body":["মাদরাসাতুল ওহীর শিক্ষা কার্যক্রমে হিফজুল কুরআন সর্বোচ্চ অগ্রাধিকার পায়। এর পাশাপাশি শিক্ষার্থীদের প্রয়োজনীয় সাধারণ শিক্ষায় শিক্ষিত করে তুলতে নির্বাচিত বিষয়গুলো পাঠ্যক্রমে অন্তর্ভুক্ত করা হয়েছে। আমরা দুটি স্বতন্ত্র শিক্ষাধারাকে এমনভাবে সমন্বয় করি, যাতে সাধারণ শিক্ষার কার্যক্রম হিফজের অগ্রগতিকে ব্যাহত না করে; বরং শিক্ষার্থীর সামগ্রিক জ্ঞান ও মননের বিকাশে ভূমিকা রাখে।","আমাদের প্রত্যাশা, এ পরিকল্পিত শিক্ষাব্যবস্থার মাধ্যমে শিক্ষার্থীরা একদিকে যেমন দক্ষ ও যত্নশীল হাফেজ হিসেবে গড়ে উঠবে, অন্যদিকে প্রয়োজনীয় সাধারণ জ্ঞান ও জীবনদক্ষতায় সমৃদ্ধ সুশিক্ষিত মানুষ হিসেবেও নিজেদের গড়ে তুলবে।"]},{"head":"পাঠদান ও তদারকি","body":["আমাদের পাঠদান পরিচালিত হয় সুনির্দিষ্ট পদ্ধতি ও নিয়মিত মূল্যায়নের ভিত্তিতে। শিক্ষার্থীদের হিফজ কার্যক্রমকে সুসংহত ও মজবুত করার লক্ষ্যে প্রতিদিনের পাঠ চারটি ধাপে বিন্যস্ত: নতুন সবক, চলমান পারার সাত-সবক, পূর্বে মুখস্থ করা পারা থেকে আমুখতা এবং তিলাওয়াত।","হিফজের ধারাবাহিকতা ও মজবুত ইয়াদ নিশ্চিত করতে প্রতি সপ্তাহে সবীনা এবং সাপ্তাহিক, মাসিক ও সেমিস্টারভিত্তিক পরীক্ষার ব্যবস্থা রয়েছে। এসব মূল্যায়নের মাধ্যমে শিক্ষার্থীদের মুখস্থের মান, পাঠের অগ্রগতি ও শুদ্ধতা পর্যবেক্ষণ করা হয়।","প্রতিটি শিক্ষার্থীর দৈনিক পাঠ, উপস্থিতি ও আদব-আখলাকের তথ্য নিয়মিত রিপোর্ট বইয়ে লিপিবদ্ধ করা হয়। অভিভাবকগণ প্রতি মাসে এই রিপোর্ট পর্যবেক্ষণের মাধ্যমে সন্তানের শিক্ষাগত অগ্রগতি ও আচরণগত অবস্থার বিষয়ে অবগত হতে পারেন।","প্রতিটি শিশুর প্রতি যথাযথ ব্যক্তিগত মনোযোগ ও নিবিড় তদারকি নিশ্চিত করতে প্রতি গ্রুপে সর্বোচ্চ ১২ জন শিক্ষার্থী রাখা হয়।"]},{"head":"বিভাগ ও ব্যবস্থাপনা","body":["মাদরাসাতুল ওহীতে বালক শাখার পাশাপাশি রয়েছে সম্পূর্ণ পৃথক ব্যবস্থাপনায় পরিচালিত বালিকা শাখা, যেখানে পর্দার সুষ্ঠু ব্যবস্থা নিশ্চিত করে অভিজ্ঞ মহিলা শিক্ষিকাদের মাধ্যমে যাবতীয় শিক্ষা কার্যক্রম পরিচালিত হয়। আমাদের শিক্ষা কার্যক্রমে রয়েছে নূরানী ও প্রাক-প্রাথমিক বিভাগ, ইন্টারন্যাশনাল হিফজুল কুরআন বিভাগ, হিফজ শোনানো (রিভিশন) বিভাগ, এক বছর মেয়াদি খুসূসী বিভাগ এবং সাধারণ বিদ্যালয়ে অধ্যয়নরত শিক্ষার্থীদের জন্য আফটার স্কুল মক্তব।","শিক্ষার্থীদের প্রয়োজন বিবেচনায় আবাসিক ও অনাবাসিক—উভয় ব্যবস্থাই চালু রয়েছে। শিশুদের নিরাপত্তায় রয়েছে সার্বক্ষণিক সিসিটিভি পর্যবেক্ষণ। পাঠদান ও আবাসনের পরিবেশ আরামদায়ক রাখতে শ্রেণিকক্ষ ও আবাসন শীতাতপ নিয়ন্ত্রিত। পাশাপাশি শিক্ষার্থীদের সুস্বাস্থ্য ও পুষ্টির কথা বিবেচনা করে রয়েছে সুষম ও পুষ্টিকর খাবারের ব্যবস্থা।"]},{"head":"চরিত্র গঠন ও আত্মশুদ্ধি","body":["আমাদের লক্ষ্য শিক্ষার্থীদের শুধু মেধাবী করে গড়ে তোলা নয়; বরং জ্ঞান, নৈতিকতা, বিনয় ও আমানতদারিতায় সমৃদ্ধ আদর্শ মানুষ হিসেবে গড়ে তোলা। এ লক্ষ্যে তাহাজ্জুদে অভ্যস্ত করা, দৈনন্দিন সুন্নাহ ও প্রয়োজনীয় মাসআলা চর্চা এবং আলেমদের সান্নিধ্যে নিয়মিত তালীম-তারবিয়াতের ব্যবস্থা রয়েছে।","পাশাপাশি শিক্ষার্থীদের সৃজনশীলতা, আত্মবিশ্বাস ও আত্মপ্রকাশের দক্ষতা বিকাশে রয়েছে সুন্দর হাতের লেখার অনুশীলন, বাংলা ও ইংরেজিতে সাবলীলভাবে কথা বলা এবং জনসম্মুখে বক্তব্য প্রদানের চর্চা। শিক্ষাসফর ও খেলাধুলার মাধ্যমে তাদের শারীরিক ও মানসিক বিকাশে গুরুত্ব দেওয়া হয়। ফল উৎসব ও পিঠা উৎসবের মতো আনন্দঘন আয়োজন শিক্ষার্থীদের নিজস্ব সংস্কৃতি ও ঐতিহ্যের সঙ্গে পরিচিত হওয়ার সুযোগ করে দেয়।","এ ছাড়া প্রতিটি শিক্ষার্থীর হিফজ সম্পন্ন হওয়ার পর আয়োজন করা হয় পবিত্র কুরআনের খতম ও পাগড়ি অনুষ্ঠান। এটি শিক্ষার্থীর অর্জনের স্বীকৃতি, শিক্ষক-অভিভাবকদের আনন্দের উপলক্ষ এবং কুরআনের সঙ্গে আজীবন সম্পর্ক বজায় রাখার অনুপ্রেরণা হিসেবে স্মরণীয় হয়ে থাকে।"]},{"head":"আমাদের পথচলা","body":["মাদরাসাতুল ওহীকে আমরা একটি দীর্ঘমেয়াদি শিক্ষা-প্রকল্প হিসেবে বিবেচনা করি। শিক্ষার মানোন্নয়ন, শিক্ষক প্রশিক্ষণ, নিয়মিত মূল্যায়ন এবং অভিভাবকদের গঠনমূলক সম্পৃক্ততার মাধ্যমে ধাপে ধাপে এগিয়ে যাওয়াই আমাদের লক্ষ্য। আমরা বিশ্বাস করি, একটি সুশৃঙ্খল শিক্ষাব্যবস্থা, যোগ্য শিক্ষক এবং সহায়ক পরিবেশ শিক্ষার্থীদের বিকাশে গুরুত্বপূর্ণ ভূমিকা রাখে। তাই নির্দিষ্ট কোনো ফলাফলের নিশ্চয়তা দেওয়ার পরিবর্তে শিক্ষার্থীদের জন্য একটি উপযুক্ত শিক্ষার ভিত্তি ও পরিবেশ গড়ে তুলতে আমরা আন্তরিকভাবে কাজ করে যাচ্ছি।"]}]},{"id":"directors","title":"পরিচালনা পর্ষদ","glyph":"♧","desc":"৭ জনের ছবি, নাম ও পদবি","kind":"directors"},{"id":"significance","title":"পাগড়ি অনুষ্ঠানের তাৎপর্য","glyph":"❖","desc":"অর্জনের মর্যাদা ও দায়িত্ব","kind":"prose","content":[{"head":"পাগড়ি অনুষ্ঠানের তাৎপর্য","body":["পবিত্র কুরআনুল কারিমের হিফজ সম্পন্ন করা একজন শিক্ষার্থীর জীবনে এক অনন্য গৌরব ও মর্যাদার অর্জন। পাগড়ি অনুষ্ঠান সেই অর্জনের আনুষ্ঠানিক স্বীকৃতি, শিক্ষার্থীর প্রতি ভালোবাসা ও উৎসাহের প্রকাশ এবং তার ওপর অর্পিত কুরআনের হিফাজত ও চর্চার মহান দায়িত্বের স্মারক।","সম্মানিত অতিথি, অভিভাবক, শিক্ষক ও শুভানুধ্যায়ীদের উপস্থিতিতে আয়োজিত এ অনুষ্ঠান শিক্ষার্থীর ভবিষ্যৎ জীবনের জন্য দোয়া ও শুভকামনা জানানোর এক বিশেষ উপলক্ষ। একই সঙ্গে এটি কুরআনের সঙ্গে আজীবন সম্পর্ক অটুট রাখা, অর্জিত হিফজের সংরক্ষণ ও নিয়মিত চর্চা অব্যাহত রাখা এবং কুরআনের শিক্ষা ও আদর্শ জীবনে ধারণ করার অনুপ্রেরণা জোগায়।"]}]},{"id":"guidance","title":"দিকনির্দেশনা ও জীবন","glyph":"☼","desc":"অভিভাবক, শিক্ষা ও আবাসিক জীবন","kind":"prose","content":[{"head":"দ্বীনী শিক্ষায় পিতা-মাতার ভূমিকা","body":["—মুফতী মূসা আল হাবীব","আমাদের জীবনের সবচেয়ে মূল্যবান সম্পদ হলো ঈমান। ঈমানের আসল সৌন্দর্য প্রকাশ পায় দ্বীনী জ্ঞান, উত্তম চরিত্র ও নেক আমলের মাধ্যমে। একটি শিশু যখন পৃথিবীতে আগমন করে, তখন তার হৃদয় থাকে নির্মল ও নিষ্পাপ। তার জীবনের প্রথম পাঠশালা হলো পরিবার, আর প্রথম শিক্ষক হলেন পিতা-মাতা। তাঁদের আদর্শ, আচরণ ও শিক্ষা শিশুর ভবিষ্যৎ জীবন গঠনে গভীর প্রভাব বিস্তার করে।","সন্তানের জন্য পিতা-মাতার দায়িত্ব কেবল খাদ্য, বস্ত্র, বাসস্থান ও জাগতিক শিক্ষার ব্যবস্থা করেই শেষ হয় না; বরং তার অন্তরে আল্লাহ তাআলার পরিচয়, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লামের অনুসরণ এবং আখিরাতের জবাবদিহির অনুভূতি জাগ্রত করাও তাঁদের অন্যতম প্রধান কর্তব্য।","সন্তানকে আদর্শ মানুষ হিসেবে গড়তে পিতা-মাতার ভূমিকা কী ও কেমন হওয়া উচিত, সহজে বুঝার জন্য কয়েকটি পয়েন্টে আলোচনা করছি।","১. সন্তান আল্লাহ তাআলার পক্ষ থেকে আমানত","সন্তান পিতা-মাতার কাছে মহান আল্লাহর পক্ষ থেকে এক মহামূল্যবান আমানত। এই আমানতের যথাযথ পরিচর্যা করা এবং তাকে ঈমান ও আমলের আলোয় আলোকিত করে গড়ে তোলা পিতা-মাতার অপরিহার্য দায়িত্ব।","আল্লাহ তাআলা ইরশাদ করেন:—","يَا أَيُّهَا الَّذِينَ آمَنُوا قُوا أَنْفُسَكُمْ وَأَهْلِيكُمْ نَارًا.","অর্থ: “হে মুমিনগণ! তোমরা নিজেদেরকে এবং তোমাদের পরিবার-পরিজনকে জাহান্নামের আগুন থেকে রক্ষা করো।”  (সূরা আত-তাহরীম:- ৬)","এই আয়াতের মাধ্যমে আল্লাহ তাআলা পরিবার-পরিজনের ঈমান ও আমল সংশোধনের নির্দেশ দিয়েছেন। অতএব, একজন পিতা-মাতার দায়িত্ব শুধু সন্তানকে দুনিয়ার জীবনে প্রতিষ্ঠিত করা নয়; বরং আখিরাতের সফলতার উপযোগী করে গড়ে তোলাও।","২. সন্তানের প্রথম শিক্ষাপ্রতিষ্ঠান পরিবার","একটি শিশুর জীবনের প্রথম বিদ্যালয় হলো তার পরিবার। প্রথম শিক্ষক হলেন মা,বাবা। সে পরিবারের পরিবেশ থেকেই ভাষা, আচরণ, শিষ্টাচার ও মূল্যবোধ শিখতে শুরু করে।","রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম ইরশাদ করেন:—","كُلُّ مَوْلُودٍ يُولَدُ عَلَى الْفِطْرَةِ، فَأَبَوَاهُ يُهَوِّدَانِهِ أَوْ يُنَصِّرَانِهِ أَوْ يُمَجِّسَانِهِ.","অর্থ: “প্রত্যেক নবজাতক ফিতরাতের ওপর জন্মগ্রহণ করে। অতঃপর তার পিতা-মাতাই তাকে ইহুদি, খ্রিষ্টান অথবা অগ্নিপূজক হিসেবে গড়ে তোলে।”  (সহীহ বুখারী:-১৩৫৮)","এই হাদীস থেকে বোঝা যায়, সন্তানের ঈমান আকীদা, আমল-আখলাক, চিন্তা-চেতনা ও ব্যক্তিত্ব গঠনে পিতা-মাতার প্রভাব অত্যন্ত গভীর। তাই শৈশব থেকেই সন্তানের অন্তরে তাওহীদ, রিসালাত, আখিরাত ও ইসলামী আদর্শের ভিত্তি স্থাপন করতে হবে।","৩. তাওহীদ ও আকীদার শিক্ষা প্রদান","দ্বীনী শিক্ষার সর্বপ্রথম বিষয় হলো আল্লাহ তাআলার পরিচয় ও তাঁর একত্ববাদের শিক্ষা। সন্তানের অন্তরে ছোটবেলা থেকেই আল্লাহর প্রতি ভালোবাসা ও ভয় সৃষ্টি করতে হবে।","কুরআনুল কারীমে হযরত লোকমান আলাইহিস সালামের সন্তানের প্রতি উপদেশের বর্ণনা এসেছে এভাবে—","يَا بُنَيَّ لَا تُشْرِكْ بِاللَّهِ ۖ إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ.","অর্থ: “হে আমার প্রিয় বৎস! আল্লাহর সঙ্গে শিরক করো না। নিশ্চয়ই শিরক মহা জুলুম।”   (সূরা লুকমান:-১৩)","এখানে লক্ষণীয়, হযরত লোকমান আলাইহিস সালাম অত্যন্ত স্নেহময় ভাষায় সন্তানকে তাওহীদের শিক্ষা দিয়েছেন। সুতরাং সন্তানকে দ্বীন শেখাতে হবে ভালোবাসা, মমতা, প্রজ্ঞা ও সুন্দর উপদেশের মাধ্যমে।","৪. সালাত ও ইবাদতের প্রতি অভ্যস্ত করা","সন্তানের দ্বীনী শিক্ষার অন্যতম গুরুত্বপূর্ণ অংশ হলো তাকে সালাত বা নামাজের প্রতি অভ্যস্ত করে তোলা।","আল্লাহ তাআলা বলেন:—","وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا.","অর্থ: “তোমার পরিবারকে সালাতের নির্দেশ দাও এবং নিজেও এর ওপর অবিচল থাকো।”   (সূরা ত্বহা:- ১৩২)","রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম ইরশাদ করেন:—","مُرُوا أَوْلَادَكُمْ بِالصَّلَاةِ وَهُمْ أَبْنَاءُ سَبْعِ سِنِينَ.","অর্থ: “তোমরা তোমাদের সন্তানদের সাত বছর বয়সে নামাজের নির্দেশ দাও।”   (সুনানে আবু দাউদ:- ৪৯৫)","অতএব, পিতা-মাতার উচিত ছোটবেলা থেকেই সন্তানকে নামাজের গুরুত্ব বোঝানো, কুরআন তিলাওয়াত শেখানো, ফরজে আইন পরিমাণ দ্বীনী ইলম শেখানো এবং বাস্তব জীবনে সুন্নাহ মোতাবেক ইসলামী বিধিবিধান পালনে অভ্যস্ত করে তোলা।","৫. উত্তম চরিত্র গঠনে পিতা-মাতার ভূমিকা","দ্বীনী শিক্ষার উদ্দেশ্য শুধু ধর্মীয় জ্ঞান অর্জন নয়; বরং একজন মানুষকে উত্তম চরিত্রের অধিকারী হিসেবে গড়ে তোলা। সত্যবাদিতা, আমানতদারিতা, বিনয়, ধৈর্য, সহনশীলতা ও ক্ষমাশীলতা, বড়দের সম্মান ও ছোটদের স্নেহ—এসব গুণ সন্তানের মধ্যে বিকশিত করতে হবে।","রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম ইরশাদ করেন-—","مَا نَحَلَ وَالِدٌ وَلَدًا مِنْ نَحْلٍ أَفْضَلَ مِنْ أَدَبٍ حَسَنٍ.","অর্থ: “কোনো পিতা তার সন্তানকে উত্তম শিষ্টাচারের চেয়ে অধিক মূল্যবান কোনো উপহার দিতে পারেনি।”    (জামে তিরমিযী:- ১৯৫২)","সুতরাং সন্তানের জন্য সবচেয়ে মূল্যবান সম্পদ শুধু অর্থ-সম্পদ নয়; বরং উত্তম চরিত্র ও নৈতিক আদর্শ।","৬. পিতা-মাতার আমলই সন্তানের জন্য আদর্শ","সন্তানকে দ্বীন শেখানোর সবচেয়ে কার্যকর পদ্ধতি হলো নিজের জীবনকে দ্বীনের আদর্শে সাজানো। কারণ, সন্তান শুধু পিতা-মাতার মুখের কথা শোনে না; বরং তাঁদের প্রতিটি আচরণ, উচ্চারণ গভীরভাবে পর্যবেক্ষণ করে।","আল্লাহ তাআলা ইরশাদ করেন:—","لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ ۝ كَبُرَ مَقْتًا عِنْدَ اللَّهِ أَنْ تَقُولُوا مَا لَا تَفْعَلُونَ.","অর্থ: “তোমরা এমন কথা কেন বলো, যা নিজেরা করো না? তোমরা যা করো না, তা বলা আল্লাহর কাছে অত্যন্ত অসন্তোষজনক।”  (সূরা আস-সফ:-২,৩)","তাই পিতা-মাতাকে নিজেরাই নামাজের প্রতি যত্নবান হতে হবে, কুরআন তিলাওয়াত করতে হবে, সত্য কথা বলতে হবে এবং ইসলামী শিষ্টাচার অনুসরণ করতে হবে। তাঁদের বাস্তব আমলই সন্তানের জীবনে সবচেয়ে কার্যকর শিক্ষা হয়ে উঠবে।","৭. দ্বীনী শিক্ষাপ্রতিষ্ঠানে পাঠানো","সন্তানের দ্বীনী শিক্ষার জন্য পারিবারিক পরিবেশের পাশাপাশি উপযুক্ত দ্বীনী শিক্ষাপ্রতিষ্ঠানের ব্যবস্থাও করতে হবে। তাকে যোগ্য ও আদর্শ শিক্ষকের কাছে কুরআন-হাদীস, বিশুদ্ধ আকীদা, ফিকহ ও ইসলামী জ্ঞান অর্জনের সুযোগ করে দিতে হবে।","এখানে একটি কথা বিশেষভাবে মনে রাখতে হবে,  সন্তানকে মাদরাসায় ভর্তি করিয়ে দিয়েই পিতা-মাতার দায়িত্ব শেষ হয়ে যায় না। বরং সন্তানের পড়াশোনা, আমল-আখলাক ও নৈতিক উন্নতির খোঁজখবর রাখাও তাঁদের কর্তব্য।","৮. সন্তানের জন্য দু‘আ ও দ্বীনী পরিবেশ তৈরী","সন্তানকে দ্বীনদার হিসেবে গড়ে তুলতে শিক্ষা ও পরিচর্যার পাশাপাশি আল্লাহর কাছে দু‘আ করতে হবে।","কুরআনুল কারীমে আল্লাহ তাআলা আমাদেরকে দু‘আও শিখিয়েছেন:—","رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا.","অর্থ: “হে আমাদের প্রতিপালক! আমাদের স্ত্রী ও সন্তানদের পক্ষ থেকে আমাদের জন্য চোখের শীতলতা দান করুন এবং আমাদের মুত্তাকিদের জন্য আদর্শ বানিয়ে দিন।”   (সূরা আল-ফুরকান:- ৭৪)","পিতা-মাতার উচিত সন্তানের জন্য নিয়মিত দু‘আ করা, ঘরে কুরআন তিলাওয়াত,জিকির-আজকার ও দ্বীনী পরিবেশ তৈরি করা এবং তাকে অসৎ সঙ্গ ও অনৈতিক পরিবেশ থেকে রক্ষা করা।","৯. একটি বিশেষ দায়িত্ব","বর্তমান সময় ফেতনা ফাসাদের সময়। সন্তানদের দ্বীনী শিক্ষার ক্ষেত্রে পিতা-মাতাকে বিশেষ সতর্কতা অবলম্বন করতে হবে। প্রযুক্তির অবাধ ব্যবহার, সামাজিক যোগাযোগমাধ্যম, নিষিদ্ধ বিনোদন, অসৎ সঙ্গ ও অবৈধ সম্পর্ক এবং নৈতিক অবক্ষয়ের নানা উপাদান শিশুকিশোরদের চিন্তা-চেতনাকে মারাত্মকভাবে প্রভাবিত করছে।","এ অবস্থায় প্রতিটি পিতা-মাতার অপরিহার্য দায়িত্ব হলো:- সন্তান পরিণত বোধসম্পন্ন ও ভালো-মন্দের পার্থক্য অনুধাবনে সক্ষম হওয়ার আগ পর্যন্ত তাকে টেলিভিশন, কম্পিউটার, ল্যাপটপ, মোবাইল, ফেসবুক, টিকটক, ইনস্টাগ্রাম, ভিডিও গেমস ইত্যাদি থেকে সম্পূর্ণ দূরে রাখা।","পাশাপাশি সন্তান পরিণত হওয়ার পরেও কী দেখছে, কী শুনছে এবং কার সঙ্গে মিশছে, সে বিষয়ে পূর্ণ সচেতন থাকা।","১০. নেক সন্তান পিতা-মাতার জন্য সদকায়ে জারিয়া","সন্তানদেরকে আদর্শ মানুষ এবং দ্বীনদার হিসেবে গড়তে পারলে এর লাভ পিতা-মাতারই।  দুনিয়াতে তো আছেই, আখিরাতেও নেক সন্তান জাহান্নাম থেকে মুক্তির কারণ হবে।","হাদীস শরীফে রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম ইরশাদ করেন:—","إِذَا مَاتَ الْإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ... أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ.","অর্থ: “মানুষ মৃত্যুবরণ করলে তার সব আমল বন্ধ হয়ে যায়, তবে তিনটি আমল এমন রয়েছে, যার সওয়াব মৃত্যুর পরও অব্যাহত থাকে। তার মধ্যে একটি হলো নেক সন্তান, যে তার জন্য দু‘আ করে।”    (সহীহ মুসলিম:-১৬৩১)","আল্লাহ তাআলা আমাদেরকে পরিপূর্ণ দ্বীনদার হওয়ার তৌফিক দান করেন, আমাদের সন্তানদেরকেও দ্বীনের জন্য কবুল করেন। আমীন!"]}},{"head":"হিফযের পরবর্তী শিক্ষাপথ","body":["হিফজ সমাপনের পর শিক্ষার্থীদের আগ্রহ, যোগ্যতা ও প্রস্তুতি অনুযায়ী পরবর্তী শিক্ষার পথ বেছে নিতে সহায়তা করা প্রতিষ্ঠানের পরিকল্পনার অংশ।","খুসূসী বিভাগ ও কওমী শিক্ষা","এক বছর মেয়াদি ব্রিজ কোর্সের মাধ্যমে দ্বীনি ও সাধারণ শিক্ষার ভিত্তি সুদৃঢ় করে কওমী নেসাবের মুতাওয়াসসেতা পরবর্তী জামাতে অধ্যয়নের উপযোগী করে তোলার প্রস্তুতি দেওয়া হয়।","আলিয়া ও সাধারণ শিক্ষাধারা","জাতীয় শিক্ষাক্রম অনুসরণে প্রস্তুতির লক্ষ্য হলো শিক্ষার্থীকে আলিয়া মাদরাসা বা সাধারণ বিদ্যালয়ের অষ্টম শ্রেণিতে অগ্রসর হওয়ার উপযোগী করে তোলা।","আরবি ও উচ্চশিক্ষা","দ্বীনি শিক্ষার উচ্চতর ধাপ সম্পন্ন করে আরবি ও অন্যান্য বিষয়ে উচ্চশিক্ষা এবং গবেষণার পথেও শিক্ষার্থীরা অগ্রসর হতে পারে। এসব সম্ভাবনা বাস্তবায়নে নিজস্ব আগ্রহ, যোগ্যতা ও পরিশ্রম গুরুত্বপূর্ণ।","এই প্রস্তুতি কোনো নিশ্চিত ফলাফলের প্রতিশ্রুতি নয়; শিক্ষার্থীর জন্য উপযুক্ত ভিত্তি ও সহায়ক পরিবেশ গড়ে তোলাই এর উদ্দেশ্য।"]},{"head":"আদব আখলাক ও জীবনদক্ষতা","body":["প্রিয় হিফজ বিভাগের শিক্ষার্থীরা!","তোমরা পবিত্র কুরআনের হাফেজ হওয়ার মহান স্বপ্ন নিয়ে পড়াশোনা করছ। মনে রেখো, একজন প্রকৃত হাফেজ শুধু কুরআনের শব্দগুলো মুখস্থ রাখেন না; বরং কুরআনের শিক্ষা নিজের চরিত্র, আচরণ ও জীবনে বাস্তবায়ন করেন।","কুরআনের জ্ঞান অর্জনের পাশাপাশি আমাদের সুন্দর আদব-আখলাক, উত্তম চরিত্র, শিষ্টাচার, বিনয়, ধৈর্য, শৃঙ্খলাবোধ, দায়িত্বশীলতা এবং মানুষের সঙ্গে সুন্দর আচরণ শেখা অত্যন্ত জরুরি।","আর জীবন দক্ষতা হলো—নিজের কাজ নিজে করতে শেখা, সময়ের সঠিক ব্যবহার করা, সঠিক সিদ্ধান্ত নেওয়া, সমস্যা মোকাবিলা করা, অন্যের অধিকার বোঝা এবং একজন আদর্শ মানুষ হিসেবে নিজেকে গড়ে তোলা।","আমাদের লক্ষ্য শুধু একজন হাফেজ তৈরি করা নয়; বরং এমন একজন আদর্শ হাফেজ তৈরি করা, যিনি হবেন কুরআনের ধারক, উত্তম চরিত্রের অধিকারী, মার্জিত আচরণের মানুষ এবং সমাজ ও পরিবারের জন্য একজন যোগ্য, দায়িত্বশীল ও কল্যাণকর ব্যক্তিত্ব।","মনে রাখবে—কুরআন মুখস্থ করা তোমার পরিচয়, আর কুরআনের আলোকে জীবন গড়া হবে তোমার প্রকৃত সৌন্দর্য।","মাসুদ কায়সার।","(কেন্দ্রীয় সিনিয়র প্রশিক্ষক-হুফ্ফাজুল কুরআন
